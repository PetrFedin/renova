# Renova canonical local runtime.
# This file is DEVELOPMENT ONLY. Staging uses docker-compose.staging.yml and
# production is deployed through the release/runtime path documented elsewhere.

name: renova-local

x-backend-build: &backend-build
  context: .
  dockerfile: backend/Dockerfile
  args:
    VCS_REF: ${RENOVA_GIT_SHA:-local-development}

x-backend-environment: &backend-environment
  ENVIRONMENT: development
  DATABASE_URL: postgresql+asyncpg://renova:renova@postgres:5432/renova
  REDIS_URL: redis://redis:6379/0
  S3_ENDPOINT: http://minio:9000
  S3_ACCESS_KEY: renova
  S3_SECRET_KEY: renova123
  S3_BUCKET: renova
  S3_PUBLIC_URL: ""
  CLOUDFRONT_DOMAIN: ""
  CLOUDFRONT_KEY_ID: ""
  PUBLIC_BASE_URL: http://127.0.0.1:8100
  SECRET_KEY: renova-local-development-secret-key-32-bytes-only
  ALLOW_CREATE_ALL: "false"
  ALLOW_DEMO_SEED: "true"
  AUTH_ALLOW_HEADER_USER_ID: "true"
  ADMIN_USER_IDS: ""
  YOOKASSA_SHOP_ID: ""
  YOOKASSA_SECRET: ""
  YOOKASSA_WEBHOOK_SECRET: ""
  TWILIO_SID: ""
  TWILIO_TOKEN: ""
  TWILIO_FROM: ""
  KONTUR_MODE: "off"
  KONTUR_API_KEY: ""
  GOSKEY_MODE: "off"
  GOSKEY_CLIENT_ID: ""
  ESIGN_WEBHOOK_SECRET: ""
  MOY_NALOG_ENABLED: "false"
  MOY_NALOG_CLIENT_ID: ""
  MOY_NALOG_CLIENT_SECRET: ""
  MOY_NALOG_REDIRECT_URI: ""
  MOY_NALOG_TOKEN_URL: ""
  MOY_NALOG_TOKEN_ENCRYPTION_KEYS: ""
  FNS_RECEIPT_LOGIN: ""
  FNS_RECEIPT_PASSWORD: ""
  SENTRY_DSN: ""
  OTEL_EXPORTER_OTLP_ENDPOINT: ""
  LOG_JSON: "false"
  OPS_ALERT_EMAIL: ""
  SMTP_HOST: ""
  SMTP_USER: ""
  SMTP_PASSWORD: ""
  SMTP_FROM: ""
  OLLAMA_DIGEST_ENABLED: "false"
  OLLAMA_BASE_URL: ""
  PUSH_RECEIPT_WORKER_ENABLED: "false"
  ALLOW_ACCOUNT_PURGE: "false"
  ACCOUNT_PURGE_OPS_SECRET: ""

services:
  postgres:
    image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    environment:
      POSTGRES_USER: renova
      POSTGRES_PASSWORD: renova
      POSTGRES_DB: renova
    ports:
      - "5433:5432"
    volumes:
      - renova_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U renova -d renova"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7.4.2-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: renova
      MINIO_ROOT_PASSWORD: renova123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - renova_minio:/data

  migrate:
    build: *backend-build
    image: renova-backend-local:dev
    env_file:
      - .env.local
    environment: *backend-environment
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build: *backend-build
    image: renova-backend-local:dev
    env_file:
      - .env.local
    environment:
      <<: *backend-environment
      RENOVA_API_INSTANCE_ID: local-api-1
    # Direct compose startup cannot bypass the same Alembic-head truth that the
    # orchestrator proves before launch.
    command: ["sh", "-ec", "python -m app.db.migration_guard && exec renova-api"]
    ports:
      - "8100:8100"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    restart: unless-stopped

  worker:
    build: *backend-build
    image: renova-backend-local:dev
    env_file:
      - .env.local
    environment:
      <<: *backend-environment
      RENOVA_WORKER_INSTANCE_ID: local-worker-1
    command: ["sh", "-ec", "python -m app.db.migration_guard && exec renova-worker"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    restart: unless-stopped

  # Optional observability profile. It is useful for local debugging only and
  # is not evidence that #283 external alert delivery is verified.
  otel-collector:
    profiles: ["obs"]
    image: otel/opentelemetry-collector:0.123.0
    command: ["--config=/etc/otel-config.yaml"]
    volumes:
      - ./infra/otel-config.yaml:/etc/otel-config.yaml:ro
    ports:
      - "4318:4318"

  jaeger:
    profiles: ["obs"]
    image: jaegertracing/all-in-one:1.68.0
    ports:
      - "16686:16686"
      - "4317:4317"

  grafana:
    profiles: ["obs"]
    image: grafana/grafana:11.5.2
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: renova
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro

volumes:
  renova_pg:
  renova_minio:
