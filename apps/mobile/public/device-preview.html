<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Renova — Device Preview</title>
  <style>
    * { box-sizing: border-box; }
    :root {
      color-scheme: dark;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --panel: rgba(15,23,42,.92);
      --line: rgba(148,163,184,.22);
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #60a5fa;
    }
    html, body { margin: 0; min-height: 100%; background: #070b14; color: var(--text); }
    body { min-height: 100vh; display: flex; flex-direction: column; }
    .toolbar {
      position: sticky; top: 0; z-index: 50;
      display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
      padding: 12px 16px; border-bottom: 1px solid var(--line);
      background: var(--panel); backdrop-filter: blur(18px);
    }
    .brand { font-weight: 800; letter-spacing: .01em; margin-right: 4px; }
    .muted { color: var(--muted); font-size: 12px; }
    .modes { display: flex; gap: 8px; flex-wrap: wrap; }
    button {
      appearance: none; border: 1px solid var(--line); background: #111827; color: #cbd5e1;
      border-radius: 10px; min-height: 36px; padding: 8px 12px; font-size: 13px; font-weight: 700;
      cursor: pointer;
    }
    button:hover { border-color: rgba(96,165,250,.6); color: #fff; }
    button.active { background: #1d4ed8; border-color: #3b82f6; color: #fff; }
    .spacer { flex: 1; }
    .stage {
      flex: 1; min-height: 0; display: grid; place-items: center;
      padding: 28px; overflow: auto;
      background:
        radial-gradient(circle at 20% 10%, rgba(37,99,235,.12), transparent 38%),
        radial-gradient(circle at 80% 90%, rgba(14,165,233,.08), transparent 40%),
        #070b14;
    }
    .device-shell {
      position: relative; flex: 0 0 auto;
      transition: width .25s ease, height .25s ease, border-radius .25s ease, padding .25s ease;
      background: #0b0f19; border: 1px solid rgba(148,163,184,.22);
      box-shadow: 0 28px 90px rgba(0,0,0,.52);
      overflow: hidden;
    }
    .device-shell.phone { width: 390px; height: 844px; border-radius: 46px; padding: 10px; }
    .device-shell.tablet { width: 834px; height: 1112px; border-radius: 28px; padding: 10px; }
    .device-shell.desktop { width: min(1440px, calc(100vw - 56px)); height: min(900px, calc(100vh - 118px)); border-radius: 16px; padding: 8px; }
    .device-shell.auto { width: calc(100vw - 56px); height: calc(100vh - 118px); border-radius: 12px; padding: 0; }
    .screen { width: 100%; height: 100%; overflow: hidden; background: #f8fafc; position: relative; }
    .phone .screen { border-radius: 38px; }
    .tablet .screen { border-radius: 20px; }
    .desktop .screen { border-radius: 10px; }
    .auto .screen { border-radius: 12px; }
    iframe { width: 100%; height: 100%; border: 0; background: #f8fafc; display: block; }
    .badge {
      position: absolute; right: 14px; bottom: 14px; z-index: 5;
      padding: 6px 9px; border-radius: 999px;
      background: rgba(15,23,42,.82); color: #cbd5e1; font-size: 11px; font-weight: 700;
      pointer-events: none; border: 1px solid rgba(148,163,184,.2); backdrop-filter: blur(10px);
    }
    .loader {
      position: absolute; inset: 0; z-index: 10; display: grid; place-items: center;
      background: #f8fafc; color: #334155; transition: opacity .2s ease;
      font-size: 14px; text-align: center; padding: 24px;
    }
    .loader.hidden { opacity: 0; pointer-events: none; }
    @media (max-width: 900px) {
      .stage { padding: 14px; place-items: start center; }
      .device-shell.tablet { transform-origin: top center; transform: scale(.82); margin-bottom: -180px; }
    }
    @media (max-width: 520px) {
      .toolbar { gap: 8px; }
      .muted, .spacer { display: none; }
      .stage { padding: 8px; }
      .device-shell.phone { transform-origin: top center; transform: scale(.88); margin-bottom: -100px; }
    }
  </style>
</head>
<body>
  <div class="toolbar">
    <div class="brand">RENOVA</div>
    <div class="muted">live localhost device preview</div>
    <div class="modes" role="group" aria-label="Размер устройства">
      <button data-mode="phone">Телефон</button>
      <button data-mode="tablet">Планшет</button>
      <button data-mode="desktop">Монитор</button>
      <button data-mode="auto">Авто</button>
    </div>
    <div class="spacer"></div>
    <button id="reload">Перезагрузить приложение</button>
  </div>

  <main class="stage">
    <section id="shell" class="device-shell phone" aria-label="Предпросмотр Renova">
      <div class="screen">
        <div id="loader" class="loader">Загружаем RENOVA…</div>
        <iframe id="app" title="RENOVA live app" src="/"></iframe>
        <div id="badge" class="badge">390 × 844</div>
      </div>
    </section>
  </main>

  <script>
    (function () {
      var shell = document.getElementById('shell');
      var app = document.getElementById('app');
      var badge = document.getElementById('badge');
      var loader = document.getElementById('loader');
      var buttons = Array.prototype.slice.call(document.querySelectorAll('[data-mode]'));
      var sizes = {
        phone: '390 × 844',
        tablet: '834 × 1112',
        desktop: '1440 × 900',
        auto: 'Адаптивно'
      };

      function setMode(mode) {
        if (!sizes[mode]) mode = 'phone';
        shell.className = 'device-shell ' + mode;
        badge.textContent = sizes[mode];
        buttons.forEach(function (b) { b.classList.toggle('active', b.dataset.mode === mode); });
        try { localStorage.setItem('renova.preview.mode', mode); } catch (e) {}
        var url = new URL(window.location.href);
        url.searchParams.set('device', mode);
        history.replaceState(null, '', url);
      }

      buttons.forEach(function (button) {
        button.addEventListener('click', function () { setMode(button.dataset.mode); });
      });

      document.getElementById('reload').addEventListener('click', function () {
        loader.classList.remove('hidden');
        app.src = '/?preview=' + Date.now();
      });

      app.addEventListener('load', function () {
        setTimeout(function () { loader.classList.add('hidden'); }, 250);
      });

      var queryMode = new URL(window.location.href).searchParams.get('device');
      var savedMode = null;
      try { savedMode = localStorage.getItem('renova.preview.mode'); } catch (e) {}
      setMode(queryMode || savedMode || 'phone');
    })();
  </script>
</body>
</html>
