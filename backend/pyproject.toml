[tool.poetry]
name = "renova-backend"
version = "0.1.0"
description = "Renova renovation platform API"
authors = ["Renova"]
readme = "README.md"
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = ">=3.12.13,<3.13"
fastapi = "0.139.2"
uvicorn = {extras = ["standard"], version = "^0.32.0"}
websockets = "^14.0"  # explicit: uvicorn[standard] often missing in venv → /ws/inbox 404
sqlalchemy = "^2.0.36"
asyncpg = "^0.30.0"
pydantic = "^2.10.0"
pydantic-settings = "^2.6.0"
httpx = "^0.28.0"
pyjwt = "2.13.0"
cryptography = "50.0.0"
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
python-multipart = "0.0.32"
aiosqlite = "^0.20.0"
alembic = "^1.14.0"
redis = "^5.2.0"
fpdf2 = "2.8.7"
sentry-sdk = "2.66.1"
opentelemetry-api = "1.44.0"
opentelemetry-sdk = "1.44.0"
opentelemetry-exporter-otlp-proto-grpc = "1.44.0"
opentelemetry-instrumentation-fastapi = "0.65b0"
boto3 = "^1.43.82"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-asyncio = "^0.24.0"
ruff = "0.14.0"
mypy = "1.18.2"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Deliberately a starting set, not the full default. E9 (syntax/runtime-shaped
# errors) and F (pyflakes: undefined names, unused imports, redefinitions) are
# the rules that find defects rather than style. Style rules can be added later
# against the same ratchet without a mechanical reformat of 58k lines.
select = ["E9", "F"]

[tool.ruff.lint.per-file-ignores]
# This facade deliberately republishes the extracted core module by copying it
# into globals() in a loop, so every name it re-exports looks undefined to a
# static reader. The pattern is documented in the module docstring; the 15
# F821s it produces are an artefact of that, not missing names.
"app/services/work_order_service.py" = ["F821"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[build-system]
requires = ["poetry-core==2.4.0"]
build-backend = "poetry.core.masonry.api"