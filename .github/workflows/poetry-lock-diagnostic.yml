name: Temporary Poetry lock diagnostic

on:
  push:
    branches:
      - fix/canonical-local-runtime-agents
    paths:
      - ".github/workflows/poetry-lock-diagnostic.yml"

permissions:
  contents: write

jobs:
  lock-boto3:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/canonical-local-runtime-agents
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.13"
      - name: Install exact Poetry
        run: python -m pip install --disable-pip-version-check "poetry==2.4.1"
      - name: Resolve boto3 through Poetry and commit generated lock
        working-directory: backend
        run: |
          set -euo pipefail
          poetry add boto3@latest
          poetry check --lock
          git diff --check -- pyproject.toml poetry.lock
          git diff --no-ext-diff --stat -- pyproject.toml poetry.lock
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml poetry.lock
          git commit -m "fix(storage): lock boto3 runtime dependency"
          git push origin HEAD:fix/canonical-local-runtime-agents
