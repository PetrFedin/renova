name: Moy Nalog credential lifecycle integrity

on:
  push:
    branches: [main]
    paths:
      - ".env.example"
      - "backend/.env.example"
      - "env.staging.example"
      - "docs/ENVIRONMENT-PROFILES.md"
      - "backend/app/main.py"
      - "backend/app/core/config.py"
      - "backend/app/core/runtime_preflight.py"
      - "backend/app/services/moy_nalog_oauth.py"
      - "backend/app/services/moy_nalog_truth_repair.py"
      - "backend/app/api/v1/fns.py"
      - "backend/app/api/v1/admin.py"
      - "backend/tests/test_moy_nalog_credential_lifecycle.py"
      - "backend/tests/test_npd_moy_nalog_truth_integrity.py"
      - "backend/tests/test_moy_nalog_truth_repair.py"
      - "backend/tests/test_runtime_preflight_integrity.py"
      - ".github/workflows/moy-nalog-credential-lifecycle-integrity.yml"
  pull_request:
    paths:
      - ".env.example"
      - "backend/.env.example"
      - "env.staging.example"
      - "docs/ENVIRONMENT-PROFILES.md"
      - "backend/app/main.py"
      - "backend/app/core/config.py"
      - "backend/app/core/runtime_preflight.py"
      - "backend/app/services/moy_nalog_oauth.py"
      - "backend/app/services/moy_nalog_truth_repair.py"
      - "backend/app/api/v1/fns.py"
      - "backend/app/api/v1/admin.py"
      - "backend/tests/test_moy_nalog_credential_lifecycle.py"
      - "backend/tests/test_npd_moy_nalog_truth_integrity.py"
      - "backend/tests/test_moy_nalog_truth_repair.py"
      - "backend/tests/test_runtime_preflight_integrity.py"
      - ".github/workflows/moy-nalog-credential-lifecycle-integrity.yml"

permissions:
  contents: read

concurrency:
  group: moy-nalog-credential-lifecycle-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  credential-lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ENVIRONMENT: test
      DATABASE_URL: sqlite+aiosqlite:///./moy-nalog-credential-tests.db
      PUBLIC_BASE_URL: http://127.0.0.1:8100
      SECRET_KEY: ci-moy-nalog-signing-secret
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12.13"
          check-latest: false
      - name: Install exact locked backend environment
        working-directory: backend
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check "poetry==2.4.1"
          poetry check --lock
          poetry sync --no-interaction
          poetry run python -m pip check
      - name: Credential lifecycle, OAuth truth, startup, and repair contracts
        working-directory: backend
        run: |
          set -euo pipefail
          poetry run pytest -q \
            tests/test_moy_nalog_credential_lifecycle.py \
            tests/test_npd_moy_nalog_truth_integrity.py \
            tests/test_moy_nalog_truth_repair.py \
            tests/test_runtime_preflight_integrity.py
      - name: Fail-closed working-environment keyring contract
        working-directory: backend
        env:
          ENVIRONMENT: production
          MOY_NALOG_ENABLED: "true"
          MOY_NALOG_CLIENT_ID: ci-client
          MOY_NALOG_CLIENT_SECRET: ci-client-secret
          MOY_NALOG_AUTHORIZE_URL: https://auth.example.test/oauth
          MOY_NALOG_TOKEN_URL: https://auth.example.test/token
          MOY_NALOG_REDIRECT_URI: https://app.example.test/callback
          REDIS_URL: redis://redis.example.test/0
          MOY_NALOG_TOKEN_ENCRYPTION_KEYS: ci-dedicated-moy-nalog-key-000000000000000001
        run: |
          set -euo pipefail
          poetry run python - <<'PY'
          from app.services import moy_nalog_oauth as oauth
          readiness = oauth.oauth_readiness()
          assert readiness.ready, readiness.missing
          health_keys = oauth._configured_encryption_keys()
          assert len(health_keys) == 1
          assert health_keys[0].key_id != ""
          PY
