name: Apply bounded chat command patch
on:
  push:
    branches: ["fix/chat-business-command-idempotency"]
    paths: [".github/workflows/agent-apply-chat-command.yml"]
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'PetrFedin/renova' && github.ref == 'refs/heads/fix/chat-business-command-idempotency' && github.actor == 'PetrFedin'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify immutable patch and exact branch ownership
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/fix/chat-business-command-idempotency | cut -f1)" = "$EXPECTED_SHA"
          python - <<'PY'
          import base64, hashlib, lzma, pathlib, re, subprocess
          root = pathlib.Path('.agent/chat-command-patch')
          chunks = [root / f'part-{i}' for i in range(6)]
          encoded = ''.join(p.read_text().strip() for p in chunks)
          assert len(encoded) == 34604
          patch = lzma.decompress(base64.b64decode(encoded, validate=True))
          assert len(patch) < 200000
          assert hashlib.sha256(patch).hexdigest() == '8e81fb4158b3adcfa0c9e8e76873df74e07c66454a1a70c151bca16e8233b3ae'
          allowed = {'PRODUCTION-READINESS.md', 'apps/mobile/components/renova/chat/ChatTaskSheet.tsx', 'apps/mobile/components/renova/chat/ChatThreadView.tsx', 'apps/mobile/lib/api/chatCommands.ts', 'apps/mobile/lib/api/chats.ts', 'apps/mobile/lib/api/client.ts', 'backend/app/api/v1/chats.py', 'backend/app/services/_work_order_service_core.py', 'backend/app/services/chat_message_mutation.py', 'backend/app/services/chat_service.py', 'backend/app/services/seed_demo.py', 'backend/tests/test_chat_business_commands.py', 'backend/tests/test_chat_business_commands_postgres.py', 'backend/tests/test_chat_thread_only_mobile_capabilities_contract.py', 'docs/RENOVA-TECHNICAL-SPECIFICATION.md', 'docs/production-readiness-evidence.json', 'docs/technical-spec/CHANGELOG-ROADMAP.md', 'docs/technical-spec/CHAT-BUSINESS-COMMAND-CONTRACT.md', 'docs/technical-spec/END-TO-END-GOVERNANCE.md', 'e2e/chat-business-command.spec.ts', 'scripts/chatBusinessCommandTransport.test.mjs'}
          paths = re.findall(r'^diff --git a/(\S+) b/(\S+)$', patch.decode('utf-8'), re.M)
          assert len(paths) == len(allowed)
          assert all(a == b for a, b in paths)
          assert {b for _, b in paths} == allowed
          subprocess.run(['git', 'apply', '--check', '--index', '-'], input=patch, check=True)
          subprocess.run(['git', 'apply', '--index', '-'], input=patch, check=True)
          contract = pathlib.Path('docs/technical-spec/CHAT-BUSINESS-COMMAND-CONTRACT.md')
          contract.write_text('\n'.join(line.rstrip() for line in contract.read_text().splitlines()) + '\n')
          subprocess.run(['git', 'add', '--', str(contract)], check=True)
          changed = set(subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True).splitlines())
          assert changed == allowed
          subprocess.run(['git', 'rm', '--', *map(str, chunks)], check=True)
          PY
      - name: Verify syntax and documentation before committing
        run: |
          set -euo pipefail
          python -m compileall -q backend/app/services/chat_business_commands.py backend/app/services/chat_message_mutation.py backend/app/services/_work_order_service_core.py backend/app/services/chat_service.py backend/app/api/v1/chats.py backend/tests/test_chat_business_commands.py backend/tests/test_chat_business_commands_postgres.py
          node scripts/technicalSpecContract.test.mjs
          node scripts/technicalSpecAlembicContract.test.mjs
          node scripts/technicalSpecAnnexContract.test.mjs
          git diff --cached --check
      - name: Publish only to the same implementation branch
        run: |
          set -euo pipefail
          git config user.name 'Renova bounded-patch automation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(chat): atomic replay-safe business commands and scoped transport recovery (#316)'
          git push origin HEAD:refs/heads/fix/chat-business-command-idempotency
