name: Chat business command integrity
on:
  push:
    paths:
      - "backend/app/api/v1/chats.py"
      - "backend/app/services/chat*.py"
      - "backend/app/services/*work_order*.py"
      - "backend/app/services/client_write*.py"
      - "backend/tests/test_chat_business_commands*.py"
      - "apps/mobile/lib/api/chats.ts"
      - "apps/mobile/lib/api/chatCommands.ts"
      - "apps/mobile/lib/api/client.ts"
      - "apps/mobile/components/renova/chat/ChatThreadView.tsx"
      - "apps/mobile/components/renova/chat/ChatTaskSheet.tsx"
      - "backend/app/services/seed_demo.py"
      - "scripts/chatBusinessCommandTransport.test.mjs"
      - "e2e/chat-business-command.spec.ts"
      - "docs/technical-spec/CHAT-BUSINESS-COMMAND-CONTRACT.md"
      - ".github/workflows/chat-business-command-integrity.yml"
  pull_request:
    paths:
      - "backend/app/api/v1/chats.py"
      - "backend/app/services/chat*.py"
      - "backend/app/services/*work_order*.py"
      - "backend/app/services/client_write*.py"
      - "backend/tests/test_chat_business_commands*.py"
      - "apps/mobile/lib/api/chats.ts"
      - "apps/mobile/lib/api/chatCommands.ts"
      - "apps/mobile/lib/api/client.ts"
      - "apps/mobile/components/renova/chat/ChatThreadView.tsx"
      - "apps/mobile/components/renova/chat/ChatTaskSheet.tsx"
      - "backend/app/services/seed_demo.py"
      - "scripts/chatBusinessCommandTransport.test.mjs"
      - "e2e/chat-business-command.spec.ts"
      - "docs/technical-spec/CHAT-BUSINESS-COMMAND-CONTRACT.md"
      - ".github/workflows/chat-business-command-integrity.yml"
permissions:
  contents: read
concurrency:
  group: chat-business-command-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  command-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
        env: { POSTGRES_USER: renova, POSTGRES_PASSWORD: renova, POSTGRES_DB: renova }
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U renova -d renova"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql+asyncpg://renova:renova@127.0.0.1:5433/renova
      CHAT_COMMAND_POSTGRES_URL: postgresql+asyncpg://renova:renova@127.0.0.1:5433/renova
      ALLOW_CREATE_ALL: "false"
      SECRET_KEY: ci-chat-command-test-secret-32chars
      ALLOW_DEMO_SEED: "false"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12.13" }
      - name: Install exact locked backend environment
        working-directory: backend
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check "poetry==2.4.1"
          poetry config virtualenvs.in-project true
          poetry check --lock
          poetry sync --no-interaction
          poetry run python -m pip check
      - name: Upgrade isolated PostgreSQL to current Alembic head
        working-directory: backend
        run: poetry run alembic upgrade head
      - name: Verify real command replay
        working-directory: backend
        run: |
          set -euo pipefail
          poetry run pytest -q tests/test_chat_business_commands.py tests/test_chat_business_commands_postgres.py tests/test_chat_message_atomicity.py tests/test_chat_thread_only_mobile_capabilities_contract.py --junitxml=chat-command-results.xml
          poetry run python - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse("chat-command-results.xml").getroot()
          assert not root.findall(".//skipped"), "a skipped race is not PostgreSQL evidence"
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chat-command-test-results
          path: backend/chat-command-results.xml
          retention-days: 14
          if-no-files-found: ignore

  mobile-command-transport:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - name: Actual transport and persistent queue replay
        run: node scripts/chatBusinessCommandTransport.test.mjs
