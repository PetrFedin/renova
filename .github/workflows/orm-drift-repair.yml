name: Temporary ORM drift repair

on:
  pull_request:
    paths:
      - ".github/workflows/orm-drift-repair.yml"
      - "backend/app/models/entities.py"

permissions:
  contents: read

jobs:
  repair-project-foreman-drift:
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/database-restore-drill' && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/database-restore-drill
          fetch-depth: 0
      - name: Remove exactly one stale ORM-only Project column
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('backend/app/models/entities.py')
          text = path.read_text(encoding='utf-8')
          target = '    foreman_id: Mapped[str | None] = mapped_column(String(36), ForeignKey("users.id"), nullable=True)\n'
          count = text.count(target)
          if count != 1:
              raise SystemExit(f'expected exactly one stale Project.foreman_id mapping, found {count}')
          path.write_text(text.replace(target, '', 1), encoding='utf-8')
          PY
          if grep -n 'foreman_id' backend/app/models/entities.py; then
            echo 'foreman_id still remains in entities.py' >&2
            exit 1
          fi
      - name: Self-remove repair workflow and commit
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/orm-drift-repair.yml
          git config user.name "Renova CI"
          git config user.email "81327591+PetrFedin@users.noreply.github.com"
          git add backend/app/models/entities.py
          git diff --cached --check
          git commit -m "Remove stale Project foreman ORM column"
          git push origin HEAD:agent/database-restore-drill
