name: Chat media ACL integrity

on:
  push:
  pull_request:

concurrency:
  group: chat-media-acl-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  chat-media-acl:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ENVIRONMENT: test
      DATABASE_URL: sqlite+aiosqlite:///./chat-media-acl.db
      PUBLIC_BASE_URL: http://127.0.0.1:8100
      SECRET_KEY: ci-secret-key-at-least-16
      ALLOW_CREATE_ALL: "true"
      ALLOW_DEMO_SEED: "false"
      PYTHONHASHSEED: "0"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.13"
      - name: Install locked backend dependencies
        working-directory: backend
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check "poetry==2.4.1"
          poetry check --lock
          poetry sync --no-interaction
          poetry run python -m pip check
      - name: Run chat media and thread-only authority contracts
        working-directory: backend
        run: |
          set -o pipefail
          poetry run pytest -vv --tb=short \
            tests/test_chat_media_acl.py \
            tests/test_chat_thread_only_acl_contract.py \
            tests/test_chat_message_atomicity.py \
            2>&1 | tee chat-media-acl.log
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chat-media-acl-diagnostics
          path: backend/chat-media-acl.log
          if-no-files-found: warn
          retention-days: 14
