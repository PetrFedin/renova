name: Temporary stage review foreman cleanup

on:
  pull_request:
    paths:
      - ".github/workflows/temporary-stage-review-foreman-cleanup.yml"

permissions:
  contents: read

jobs:
  cleanup-stage-review-foreman:
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/database-restore-drill' && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/database-restore-drill
          fetch-depth: 0
      - name: Apply reviewed stage review cleanup
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('backend/app/services/stage_review_service.py')
          text = path.read_text(encoding='utf-8')
          replacements = [
              (
                  '    return project.contractor_id is None and project.foreman_id is None\n',
                  '    return project.contractor_id is None\n',
              ),
              (
                  '    return sorted(\n        user_id\n        for user_id in {project.contractor_id, project.foreman_id}\n        if user_id\n    )\n',
                  '    return [project.contractor_id] if project.contractor_id else []\n',
              ),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected one reviewed stage-review replacement, found {count}')
              text = text.replace(old, new, 1)
          for forbidden in ('project.foreman_id', 'foreman_id='):
              if forbidden in text:
                  raise SystemExit(f'stale Project foreman contract remains: {forbidden}')
          path.write_text(text, encoding='utf-8')
          PY
          git diff --check -- backend/app/services/stage_review_service.py
      - name: Commit regular-file cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Renova CI"
          git config user.email "81327591+PetrFedin@users.noreply.github.com"
          git add -- backend/app/services/stage_review_service.py
          git diff --cached --check
          git commit -m "Remove stale foreman stage review source"
          git push origin HEAD:agent/database-restore-drill
