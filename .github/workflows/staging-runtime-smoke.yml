name: Staging runtime integrity

on:
  push:
    paths:
      - "docker-compose.staging.yml"
      - "env.staging.example"
      - "scripts/staging-postgres-smoke.sh"
      - "scripts/staging-env-smoke.sh"
      - "scripts/staging-credentials-probe.sh"
      - "scripts/staging-readiness-report.sh"
      - "scripts/external-staging-release-smoke.sh"
      - "scripts/externalStagingReleaseTruth.test.mjs"
      - "scripts/database-restore-drill.sh"
      - "scripts/databaseRestoreTruth.test.mjs"
      - ".github/workflows/external-staging-release.yml"
      - ".github/workflows/database-restore-integrity.yml"
      - "docs/STAGING-RELEASE.md"
      - "docs/DISASTER-RECOVERY.md"
      - "backend/.env.example"
      - "backend/alembic/**"
      - "backend/alembic.ini"
      - "backend/scripts/restore_drill_fixture.py"
      - "backend/app/main.py"
      - "backend/app/api/deps.py"
      - "backend/app/api/v1/admin.py"
      - "backend/app/api/v1/ocr_worker.py"
      - "backend/app/core/admin_identity.py"
      - "backend/app/core/config.py"
      - "backend/app/core/environment.py"
      - "backend/app/core/runtime_policy.py"
      - "backend/app/core/runtime_preflight.py"
      - "backend/app/core/security.py"
      - "backend/app/db/migration_guard.py"
      - "backend/app/db/session.py"
      - "backend/app/services/admin_identity_service.py"
      - "backend/app/services/staging_readiness.py"
      - "backend/app/services/document_ocr_runtime.py"
      - "backend/app/services/otp_runtime.py"
      - "backend/app/services/storage_runtime.py"
      - "backend/app/services/storage_service.py"
      - "backend/tests/test_admin_identity_deployment_integrity.py"
      - "backend/tests/test_runtime_preflight_integrity.py"
      - "backend/tests/test_runtime_probe_integrity.py"
      - ".github/workflows/staging-runtime-smoke.yml"
  pull_request:
    paths:
      - "docker-compose.staging.yml"
      - "env.staging.example"
      - "scripts/staging-postgres-smoke.sh"
      - "scripts/staging-env-smoke.sh"
      - "scripts/staging-credentials-probe.sh"
      - "scripts/staging-readiness-report.sh"
      - "scripts/external-staging-release-smoke.sh"
      - "scripts/externalStagingReleaseTruth.test.mjs"
      - "scripts/database-restore-drill.sh"
      - "scripts/databaseRestoreTruth.test.mjs"
      - ".github/workflows/external-staging-release.yml"
      - ".github/workflows/database-restore-integrity.yml"
      - "docs/STAGING-RELEASE.md"
      - "docs/DISASTER-RECOVERY.md"
      - "backend/.env.example"
      - "backend/alembic/**"
      - "backend/alembic.ini"
      - "backend/scripts/restore_drill_fixture.py"
      - "backend/app/main.py"
      - "backend/app/api/deps.py"
      - "backend/app/api/v1/admin.py"
      - "backend/app/api/v1/ocr_worker.py"
      - "backend/app/core/admin_identity.py"
      - "backend/app/core/config.py"
      - "backend/app/core/environment.py"
      - "backend/app/core/runtime_policy.py"
      - "backend/app/core/runtime_preflight.py"
      - "backend/app/core/security.py"
      - "backend/app/db/migration_guard.py"
      - "backend/app/db/session.py"
      - "backend/app/services/admin_identity_service.py"
      - "backend/app/services/staging_readiness.py"
      - "backend/app/services/document_ocr_runtime.py"
      - "backend/app/services/otp_runtime.py"
      - "backend/app/services/storage_runtime.py"
      - "backend/app/services/storage_service.py"
      - "backend/tests/test_admin_identity_deployment_integrity.py"
      - "backend/tests/test_runtime_preflight_integrity.py"
      - "backend/tests/test_runtime_probe_integrity.py"
      - ".github/workflows/staging-runtime-smoke.yml"

concurrency:
  group: staging-runtime-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  postgres-redis-bearer-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.2"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.13"
      - name: Install locked backend environment
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check "poetry==2.4.1"
          cd backend
          poetry config virtualenvs.in-project true
          poetry sync --no-interaction
      - name: Validate staging, release and DR source contracts
        run: |
          set -euo pipefail
          bash -n scripts/staging-postgres-smoke.sh
          bash -n scripts/staging-env-smoke.sh
          bash -n scripts/staging-credentials-probe.sh
          bash -n scripts/staging-readiness-report.sh
          bash -n scripts/external-staging-release-smoke.sh
          bash -n scripts/database-restore-drill.sh
          node scripts/externalStagingReleaseTruth.test.mjs
          node scripts/databaseRestoreTruth.test.mjs
          python -m py_compile backend/scripts/restore_drill_fixture.py
      - name: Run canonical preflight and runtime probe contracts
        working-directory: backend
        run: poetry run pytest -q tests/test_runtime_preflight_integrity.py tests/test_admin_identity_deployment_integrity.py tests/test_runtime_probe_integrity.py
      - name: Exercise static staging credentials probe
        env:
          ENV_FILE: /dev/null
          LIVE: "0"
          ENVIRONMENT: staging
          DATABASE_URL: postgresql+asyncpg://renova:redacted@db.internal/renova
          REDIS_URL: rediss://default:redacted@redis.internal:6380/0
          PUBLIC_BASE_URL: https://api-staging.renova.example
          SECRET_KEY: ci-staging-signing-key-at-least-32-bytes
          AUTH_ALLOW_HEADER_USER_ID: "false"
          ADMIN_USER_IDS: ci-admin-user
          ALLOW_CREATE_ALL: "false"
          ALLOW_DEMO_SEED: "false"
          DOCUMENT_OCR_MODE: metadata
          TWILIO_SID: AC00000000000000000000000000000000
          TWILIO_TOKEN: ci-provider-token
          TWILIO_FROM: "+15005550006"
        run: bash scripts/staging-credentials-probe.sh
      - name: Run full isolated staging runtime smoke
        run: bash scripts/staging-postgres-smoke.sh
      - name: Upload API diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-runtime-smoke-diagnostics
          if-no-files-found: ignore
          path: |
            /tmp/renova-staging-smoke-api.log
            /tmp/renova-staging-postgres-health.json
            /tmp/renova-staging-header-auth.json
            /tmp/renova-staging-ocr-worker.json
            /tmp/renova-staging-h0-readiness.json
            /tmp/renova-staging-preflight.json
      - name: Stop isolated dependencies
        if: always()
        run: docker compose -f docker-compose.staging.yml down -v --remove-orphans

  database-logical-restore-drill:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      POSTGRES_IMAGE: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
      PGHOST: 127.0.0.1
      PGPORT: "5436"
      PGUSER: renova
      PGPASSWORD: renova
      SOURCE_DB: renova
      RESTORE_DB: renova_restore
      DR_DIR: /tmp/renova-dr
      DATABASE_URL: postgresql+asyncpg://renova:renova@127.0.0.1:5436/renova
    services:
      postgres:
        image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
        env:
          POSTGRES_USER: renova
          POSTGRES_PASSWORD: renova
          POSTGRES_DB: renova
        ports:
          - 5436:5432
        options: >-
          --health-cmd "pg_isready -U renova -d renova"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.2"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.13"
      - name: Validate DR source contract
        run: |
          set -euo pipefail
          node scripts/databaseRestoreTruth.test.mjs
          bash -n scripts/database-restore-drill.sh
          python -m py_compile backend/scripts/restore_drill_fixture.py
      - name: Install exact locked backend environment
        working-directory: backend
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check "poetry==2.4.1"
          poetry config virtualenvs.in-project true
          poetry check --lock
          poetry sync --no-interaction
          poetry run python -m pip check
      - name: Migrate and verify source schema
        working-directory: backend
        run: |
          set -euo pipefail
          poetry run alembic upgrade head
          poetry run python scripts/verify_migration_schema.py --expect present
      - name: Seed deterministic synthetic source data
        working-directory: backend
        run: poetry run python scripts/restore_drill_fixture.py seed --manifest "$DR_DIR/source-manifest.json"
      - name: Execute native backup and isolated restore
        run: bash scripts/database-restore-drill.sh
      - name: Verify restored schema and data fingerprint
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://renova:renova@127.0.0.1:5436/renova_restore
        run: |
          set -euo pipefail
          poetry run python scripts/verify_migration_schema.py --expect present
          poetry run python scripts/restore_drill_fixture.py verify --expected "$DR_DIR/source-manifest.json"
      - name: Delete synthetic database dump
        if: always()
        run: |
          rm -f "$DR_DIR/renova.dump"
          test ! -e "$DR_DIR/renova.dump"
