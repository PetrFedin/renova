name: Database restore integrity

on:
  push:
    paths:
      - "backend/alembic/**"
      - "backend/alembic.ini"
      - "backend/app/models/**"
      - "backend/scripts/verify_migration_schema.py"
      - "backend/scripts/verify_current_migration_schema.py"
      - "backend/scripts/verify_orm_schema_parity.py"
      - "backend/scripts/restore_drill_fixture.py"
      - "backend/scripts/restore_application_smoke.py"
      - "scripts/database-restore-drill.sh"
      - "scripts/databaseRestoreTruth.test.mjs"
      - ".github/workflows/database-restore-integrity.yml"
      - "docs/DISASTER-RECOVERY.md"
  pull_request:
    paths:
      - "backend/alembic/**"
      - "backend/alembic.ini"
      - "backend/app/models/**"
      - "backend/scripts/verify_migration_schema.py"
      - "backend/scripts/verify_current_migration_schema.py"
      - "backend/scripts/verify_orm_schema_parity.py"
      - "backend/scripts/restore_drill_fixture.py"
      - "backend/scripts/restore_application_smoke.py"
      - "scripts/database-restore-drill.sh"
      - "scripts/databaseRestoreTruth.test.mjs"
      - ".github/workflows/database-restore-integrity.yml"
      - "docs/DISASTER-RECOVERY.md"

concurrency:
  group: database-restore-integrity-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  logical-restore-drill:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      POSTGRES_IMAGE: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
      PGHOST: 127.0.0.1
      PGPORT: "5436"
      PGUSER: renova
      PGPASSWORD: renova
      SOURCE_DB: renova
      RESTORE_DB: renova_restore
      DR_DIR: /tmp/renova-dr
      DATABASE_URL: postgresql+asyncpg://renova:renova@127.0.0.1:5436/renova
    services:
      postgres:
        image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
        env:
          POSTGRES_USER: renova
          POSTGRES_PASSWORD: renova
          POSTGRES_DB: renova
        ports:
          - 5436:5432
        options: >-
          --health-cmd "pg_isready -U renova -d renova"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.2"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.13"

      - name: Validate restore drill source contract
        run: |
          set -euo pipefail
          node scripts/databaseRestoreTruth.test.mjs
          bash -n scripts/database-restore-drill.sh
          python -m py_compile \
            backend/scripts/restore_drill_fixture.py \
            backend/scripts/restore_application_smoke.py \
            backend/scripts/verify_current_migration_schema.py \
            backend/scripts/verify_orm_schema_parity.py

      - name: Install exact locked backend environment
        working-directory: backend
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check "poetry==2.4.1"
          poetry config virtualenvs.in-project true
          poetry check --lock
          poetry sync --no-interaction
          poetry run python -m pip check

      - name: Migrate and verify source database
        working-directory: backend
        run: |
          set -euo pipefail
          poetry run alembic upgrade head
          poetry run python scripts/verify_current_migration_schema.py
          poetry run python scripts/verify_orm_schema_parity.py

      - name: Seed deterministic synthetic source data
        working-directory: backend
        run: poetry run python scripts/restore_drill_fixture.py seed --manifest "$DR_DIR/source-manifest.json"

      - name: Execute native logical backup and isolated restore
        run: bash scripts/database-restore-drill.sh

      - name: Verify restored schema and data fingerprint
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://renova:renova@127.0.0.1:5436/renova_restore
        run: |
          set -euo pipefail
          poetry run python scripts/verify_current_migration_schema.py
          poetry run python scripts/verify_orm_schema_parity.py
          poetry run python scripts/restore_drill_fixture.py verify \
            --expected "$DR_DIR/source-manifest.json" \
            --manifest "$DR_DIR/restored-manifest.json"

      - name: Boot application and readiness against restored database
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://renova:renova@127.0.0.1:5436/renova_restore
          ENVIRONMENT: test
          ALLOW_DEMO_SEED: "false"
          ALLOW_CREATE_ALL: "false"
          AUTH_ALLOW_HEADER_USER_ID: "false"
          REDIS_URL: ""
        run: |
          set -euo pipefail
          poetry run python scripts/restore_application_smoke.py \
            --record "$DR_DIR/application-health.json"
          poetry run python scripts/restore_drill_fixture.py verify \
            --expected "$DR_DIR/source-manifest.json" \
            --manifest "$DR_DIR/post-application-manifest.json"

      - name: Write sanitized restore verification record
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["DR_DIR"])
          source = json.loads((root / "source-manifest.json").read_text())
          restored = json.loads((root / "restored-manifest.json").read_text())
          post_application = json.loads((root / "post-application-manifest.json").read_text())
          application = json.loads((root / "application-health.json").read_text())
          timing = json.loads((root / "native-restore-timing.json").read_text())
          if source != restored or source != post_application:
              raise SystemExit("source/restored/post-application manifests diverged")
          if application.get("application_health_verified") is not True:
              raise SystemExit("restored application health was not verified")
          if application.get("database") != os.environ["RESTORE_DB"]:
              raise SystemExit("application smoke targeted unexpected restore database")
          record = {
              "verified": True,
              "database_engine": "PostgreSQL 17",
              "backup_format": "pg_dump custom",
              "alembic_revision": source["snapshot"]["alembic_revision"],
              "fixture_fingerprint_sha256": source["fingerprint_sha256"],
              "post_application_fingerprint_sha256": post_application["fingerprint_sha256"],
              "dump_bytes": (root / "renova.dump").stat().st_size,
              "restore_target": "isolated-renova_restore",
              "application_health_verified": True,
              "application_health_status": application["health_status"],
              "application_ready_status": application["ready_status"],
              "native_backup_restore_seconds": timing["native_backup_restore_seconds"],
              "timing_scope": timing["scope"],
          }
          (root / "restore-verification.json").write_text(
              json.dumps(record, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(record, sort_keys=True))
          PY

      - name: Delete synthetic database dump
        if: always()
        run: |
          rm -f "$DR_DIR/renova.dump"
          test ! -e "$DR_DIR/renova.dump"

      - name: Upload sanitized restore verification only
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: database-restore-verification
          retention-days: 90
          if-no-files-found: error
          path: /tmp/renova-dr/restore-verification.json
