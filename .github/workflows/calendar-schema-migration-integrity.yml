name: Database schema integrity

on:
  push:
    paths:
      - "backend/alembic/**"
      - "backend/alembic.ini"
      - "backend/app/db/migration_guard.py"
      - "backend/app/db/session.py"
      - "backend/app/models/**"
      - "backend/pyproject.toml"
      - "backend/poetry.lock"
      - "backend/scripts/verify_migration_schema.py"
      - "backend/scripts/verify_current_migration_schema.py"
      - "backend/scripts/verify_orm_schema_parity.py"
      - "backend/tests/test_database_revision_guard.py"
      - ".github/workflows/calendar-schema-migration-integrity.yml"
  pull_request:
    paths:
      - "backend/alembic/**"
      - "backend/alembic.ini"
      - "backend/app/db/migration_guard.py"
      - "backend/app/db/session.py"
      - "backend/app/models/**"
      - "backend/pyproject.toml"
      - "backend/poetry.lock"
      - "backend/scripts/verify_migration_schema.py"
      - "backend/scripts/verify_current_migration_schema.py"
      - "backend/scripts/verify_orm_schema_parity.py"
      - "backend/tests/test_database_revision_guard.py"
      - ".github/workflows/calendar-schema-migration-integrity.yml"

concurrency:
  group: database-schema-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  postgres-schema-lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
        env:
          POSTGRES_USER: renova
          POSTGRES_PASSWORD: renova
          POSTGRES_DB: renova
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U renova -d renova"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ENVIRONMENT: staging
      DATABASE_URL: postgresql+asyncpg://renova:renova@127.0.0.1:5433/renova
      PUBLIC_BASE_URL: https://ci-staging.example.com
      SECRET_KEY: ci-staging-secret-key-32chars!!
      ALLOW_CREATE_ALL: "false"
      ALLOW_DEMO_SEED: "false"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.13"
      - name: Install exact locked backend environment
        working-directory: backend
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check "poetry==2.4.1"
          poetry config virtualenvs.in-project true
          poetry check --lock
          poetry sync --no-interaction
          poetry run python -m pip check
      - name: Run revision guard contracts
        working-directory: backend
        run: poetry run pytest -q tests/test_database_revision_guard.py
      - name: Reject empty PostgreSQL database
        working-directory: backend
        run: |
          set -euo pipefail
          if poetry run python -m app.db.migration_guard; then
            echo "revision guard accepted an empty database" >&2
            exit 1
          fi
      - name: Upgrade clean PostgreSQL database
        working-directory: backend
        run: poetry run alembic upgrade head
      - name: Verify reflected application schema
        working-directory: backend
        run: poetry run python scripts/verify_current_migration_schema.py
      - name: Verify complete ORM/Alembic column parity
        working-directory: backend
        run: poetry run python scripts/verify_orm_schema_parity.py
      - name: Accept migrated PostgreSQL database
        working-directory: backend
        run: poetry run python -m app.db.migration_guard
      - name: Downgrade new schema migrations
        working-directory: backend
        run: poetry run alembic downgrade w6webhookdelivery01
      - name: Verify migrated schema removal
        working-directory: backend
        run: poetry run python scripts/verify_migration_schema.py --expect absent
      - name: Reject downgraded PostgreSQL database
        working-directory: backend
        run: |
          set -euo pipefail
          if poetry run python -m app.db.migration_guard; then
            echo "revision guard accepted a downgraded database" >&2
            exit 1
          fi
      - name: Replay schema migrations
        working-directory: backend
        run: poetry run alembic upgrade head
      - name: Verify replayed application schema
        working-directory: backend
        run: |
          set -euo pipefail
          poetry run python scripts/verify_current_migration_schema.py
          poetry run python scripts/verify_orm_schema_parity.py
      - name: Accept replayed PostgreSQL database
        working-directory: backend
        run: poetry run python -m app.db.migration_guard
