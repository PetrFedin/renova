name: Mobile typecheck fail-closed integrity

on:
  pull_request:
    paths:
      - "apps/mobile/**"
      - "scripts/typecheck-mobile.sh"
      - "scripts/typecheck-mobile-report.mjs"
      - "scripts/typecheck-mobile-report.test.mjs"
      - ".github/workflows/mobile-typecheck-fail-closed-integrity.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-typecheck-fail-closed-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository without marketplace actions
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          auth_header="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          git -c http.extraheader="AUTHORIZATION: basic ${auth_header}" \
            fetch --no-tags --depth=1 origin "$GITHUB_REF"
          git checkout --detach FETCH_HEAD
          git remote remove origin

      - name: Verify runner Node runtime
        shell: bash
        run: |
          set -euo pipefail
          node --version
          npm --version
          node -e "const major=Number(process.versions.node.split('.')[0]); if (major < 20) { console.error('Node 20+ required'); process.exit(1); }"

      - name: Install workspace dependencies
        run: npm ci
      - name: Validate shell syntax
        run: bash -n scripts/typecheck-mobile.sh
      - name: Verify diagnostic parser contracts
        run: node scripts/typecheck-mobile-report.test.mjs
      - name: Verify truthful side-effect and filesystem export contracts
        run: |
          export TSX_TSCONFIG_PATH="$PWD/apps/mobile/tsconfig.json"
          npx tsx apps/mobile/lib/sideEffectContext.w177.test.ts
          npx tsx apps/mobile/lib/filesystemExport.w178.test.ts
      - name: Verify CLI fails closed
        run: |
          set -euo pipefail
          cat > /tmp/noise.log <<'EOF'
          app/a.tsx(1,1): error TS2786: known JSX compatibility noise
          app/b.tsx(2,1): error TS2607: known JSX attribute compatibility noise
          EOF
          node scripts/typecheck-mobile-report.mjs \
            --input=/tmp/noise.log --tsc-exit=2 --baseline=0

          cat > /tmp/one-real.log <<'EOF'
          lib/api.ts(3,4): error TS2322: Type 'string' is not assignable to type 'number'.
          EOF
          node scripts/typecheck-mobile-report.mjs \
            --input=/tmp/one-real.log --tsc-exit=2 --baseline=1
          if node scripts/typecheck-mobile-report.mjs \
            --input=/tmp/one-real.log --tsc-exit=2 --baseline=0; then
            echo "FAIL: diagnostics above baseline were accepted"
            exit 1
          fi

          printf '%s\n' 'npm ERR! could not determine executable to run' > /tmp/tooling-crash.log
          if node scripts/typecheck-mobile-report.mjs \
            --input=/tmp/tooling-crash.log --tsc-exit=127 --baseline=117; then
            echo "FAIL: tooling failure without TypeScript diagnostics was accepted"
            exit 1
          fi
      - name: Run actual mobile TypeScript integrity
        run: npm run typecheck:mobile
