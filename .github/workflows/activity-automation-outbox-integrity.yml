name: Activity automation outbox integrity

on:
  pull_request:
    paths:
      - "backend/app/services/activity_service.py"
      - "backend/app/services/automation_engine.py"
      - "backend/app/services/outbox_service.py"
      - "backend/app/services/notification_service.py"
      - "backend/app/services/outbox_inline_dispatch.py"
      - "backend/app/services/purchase_service.py"
      - "backend/tests/test_activity_automation_outbox_integrity.py"
      - "backend/tests/test_automation_reminder_dedupe_integrity.py"
      - "backend/tests/test_automation_reminders.py"
      - "backend/tests/test_outbox_failure_isolation.py"
      - "backend/tests/test_outbox_fencing_integrity.py"
      - "backend/tests/test_purchase_transition_integrity.py"
      - "backend/tests/test_work_acceptance_outbox_atomicity.py"
      - ".github/workflows/activity-automation-outbox-integrity.yml"
      - ".github/actions/setup-backend/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: activity-automation-outbox-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  activity-automation-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ENVIRONMENT: test
      DATABASE_URL: sqlite+aiosqlite:///./activity-automation-outbox-tests.db
      PUBLIC_BASE_URL: http://127.0.0.1:8100
      SECRET_KEY: ci-secret-key-at-least-16
      ALLOW_CREATE_ALL: "true"
      ALLOW_DEMO_SEED: "true"
      AUTOMATION_REMINDERS_ENABLED: "0"
      PYTHONHASHSEED: "0"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Set up locked backend environment
        uses: ./.github/actions/setup-backend
      - name: Reject silent activity automation catches
        working-directory: backend
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          path = Path("app/services/activity_service.py")
          tree = ast.parse(path.read_text(encoding="utf-8"), filename=str(path))
          silent = []
          for node in ast.walk(tree):
              if isinstance(node, ast.ExceptHandler) and len(node.body) == 1 and isinstance(node.body[0], ast.Pass):
                  silent.append(node.lineno)
          if silent:
              raise SystemExit(f"silent activity exception handlers found at lines: {silent}")
          print("activity automation silent-catch scan OK")
          PY
      - name: Verify durable activity automation contracts
        working-directory: backend
        run: |
          set -o pipefail
          timeout 480s poetry run pytest -vv -s --tb=short \
            tests/test_activity_automation_outbox_integrity.py \
            tests/test_automation_reminder_dedupe_integrity.py \
            tests/test_automation_reminders.py \
            tests/test_outbox_failure_isolation.py \
            tests/test_outbox_fencing_integrity.py \
            tests/test_purchase_transition_integrity.py \
            tests/test_work_acceptance_outbox_atomicity.py \
            2>&1 | tee activity-automation-outbox-integrity.log
      - name: Upload activity automation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: activity-automation-outbox-integrity-diagnostics
          path: backend/activity-automation-outbox-integrity.log
          if-no-files-found: warn
          retention-days: 14
