name: XML parser integrity
on:
  pull_request:
    paths: ["package-lock.json", "scripts/xmldomIntegrity.test.mjs", ".github/workflows/xml-parser-integrity.yml"]
  push:
    branches: [main]
    paths: ["package-lock.json", "scripts/xmldomIntegrity.test.mjs", ".github/workflows/xml-parser-integrity.yml"]
permissions:
  contents: read
concurrency:
  group: xml-parser-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  parser-and-consumers:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20.20.2", cache: npm }
      - run: npm ci
      - run: node scripts/xmldomIntegrity.test.mjs
      - name: Lockfile must stay unchanged
        run: git diff --exit-code -- package.json package-lock.json apps/mobile/package.json
