name: Schema catch-up candidate

on:
  pull_request:
    paths:
      - "backend/app/models/**"
      - "backend/alembic/**"
      - "backend/alembic.ini"
      - "backend/scripts/verify_orm_schema_parity.py"
      - ".github/workflows/schema-catchup-candidate.yml"

permissions:
  contents: read

jobs:
  generate-and-prove:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: postgresql+asyncpg://renova:renova@127.0.0.1:5437/renova
    services:
      postgres:
        image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
        env:
          POSTGRES_USER: renova
          POSTGRES_PASSWORD: renova
          POSTGRES_DB: renova
        ports:
          - 5437:5432
        options: >-
          --health-cmd "pg_isready -U renova -d renova"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.13"
      - name: Install exact locked backend environment
        working-directory: backend
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check "poetry==2.4.1"
          poetry config virtualenvs.in-project true
          poetry check --lock
          poetry sync --no-interaction
          poetry run python -m pip check
      - name: Upgrade existing Alembic history
        working-directory: backend
        run: |
          set -euo pipefail
          poetry run alembic upgrade head
          poetry run python scripts/verify_migration_schema.py --expect present
      - name: Generate additive catch-up migration from full ORM metadata
        working-directory: backend
        run: |
          set -euo pipefail
          poetry run alembic revision \
            --autogenerate \
            --rev-id w13ormparity01 \
            -m "materialize ORM schema parity"
          candidate="$(find alembic/versions -maxdepth 1 -type f -name 'w13ormparity01_*.py' -print -quit)"
          test -n "$candidate"
          printf '%s\n' "$candidate" > /tmp/schema-catchup-candidate-path.txt
          cp "$candidate" /tmp/schema-catchup-candidate.py
      - name: Reject destructive autogenerate operations
        shell: bash
        run: |
          set -euo pipefail
          candidate=/tmp/schema-catchup-candidate.py
          if grep -nE 'op\.(drop_table|drop_column|drop_constraint)|op\.execute\(' "$candidate"; then
            echo "::error::Schema catch-up candidate contains destructive/manual SQL operations"
            exit 1
          fi
          grep -q 'def upgrade()' "$candidate"
          grep -q 'op\.create_table\|op\.add_column' "$candidate"
      - name: Apply candidate and prove exact ORM/Alembic parity
        working-directory: backend
        run: |
          set -euo pipefail
          poetry run alembic upgrade head
          poetry run python scripts/verify_migration_schema.py --expect present
          poetry run python scripts/verify_orm_schema_parity.py
      - name: Upload reviewed candidate only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: schema-catchup-candidate
          retention-days: 7
          if-no-files-found: error
          path: /tmp/schema-catchup-candidate.py
