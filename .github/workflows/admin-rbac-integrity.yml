name: Admin RBAC integrity

on: [push, pull_request]

concurrency:
  group: admin-rbac-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  admin-rbac-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      ENVIRONMENT: test
      DATABASE_URL: sqlite+aiosqlite:///./admin-rbac-integrity-tests.db
      PUBLIC_BASE_URL: http://127.0.0.1:8100
      SECRET_KEY: ci-secret-key-at-least-16
      ALLOW_CREATE_ALL: "true"
      ALLOW_DEMO_SEED: "true"
      PYTHONHASHSEED: "0"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Set up locked backend environment
        uses: ./.github/actions/setup-backend
      - name: Compile administrative implementation
        working-directory: backend
        run: |
          poetry run python -m compileall -q \
            app/core/admin_identity.py \
            app/core/config.py \
            app/core/runtime_policy.py \
            app/core/runtime_preflight.py \
            app/services/admin_identity_service.py \
            app/services/staging_readiness.py \
            app/api/v1/admin.py \
            app/api/v1/account_lifecycle.py \
            app/api/v1/articles_admin.py \
            app/api/v1/audit.py \
            app/api/v1/automation_worker.py \
            app/api/v1/ocr_worker.py \
            tests/test_admin_identity_deployment_integrity.py \
            tests/test_platform_admin_operations_integrity.py
      - name: Administrative identity and operations contracts
        working-directory: backend
        run: |
          set -o pipefail
          timeout 480s poetry run pytest -vv -s --tb=short \
            tests/test_admin_rbac_integrity.py \
            tests/test_admin_identity_deployment_integrity.py \
            tests/test_platform_admin_operations_integrity.py \
            tests/test_runtime_preflight_integrity.py \
            tests/test_release_health_truth_integrity.py \
            2>&1 | tee admin-rbac-integrity-contracts.log
      - name: Reject direct contractor-only platform admin guards
        run: |
          set -euo pipefail
          admin_files=(
            backend/app/api/v1/admin.py
            backend/app/api/v1/account_lifecycle.py
            backend/app/api/v1/articles_admin.py
            backend/app/api/v1/audit.py
            backend/app/api/v1/automation_worker.py
            backend/app/api/v1/ocr_worker.py
            backend/app/api/v1/admin_subscription_refunds.py
          )
          if grep -n -E 'UserRole\.contractor|if .*role.*contractor' "${admin_files[@]}"; then
            echo "a platform admin operation contains a direct contractor-role guard" >&2
            exit 1
          fi
          for file in \
            backend/app/api/v1/articles_admin.py \
            backend/app/api/v1/audit.py \
            backend/app/api/v1/automation_worker.py \
            backend/app/api/v1/ocr_worker.py; do
            if grep -q 'Depends(get_current_user)' "$file"; then
              echo "$file bypasses require_admin_user" >&2
              exit 1
            fi
          done
          grep -q 'Depends(require_admin_user)' backend/app/api/v1/account_lifecycle.py
          grep -q 'authorize_account_purge(ops_secret)' backend/app/api/v1/account_lifecycle.py
      - name: Enforce deployable environment examples
        run: |
          set -euo pipefail
          grep -q '^ADMIN_USER_IDS=' .env.example
          grep -q '^ADMIN_USER_IDS=' backend/.env.example
          grep -q '^ADMIN_USER_IDS=' env.staging.example
          grep -q '^REDIS_URL=' env.staging.example
          grep -q '^TWILIO_SID=' env.staging.example
          grep -q '^TWILIO_TOKEN=' env.staging.example
          grep -q '^TWILIO_FROM=' env.staging.example
          test "$(grep -c '^ENVIRONMENT=' .env.example)" -eq 1
          test "$(grep -c '^CLOUDFRONT_DOMAIN=' .env.example)" -eq 1
      - name: Upload admin RBAC diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: admin-rbac-integrity-diagnostics
          path: backend/admin-rbac-integrity-contracts.log
          if-no-files-found: warn
          retention-days: 14
