name: Mobile hub navigation integrity

on:
  pull_request:
    paths:
      - "apps/mobile/lib/useHubTab.ts"
      - "apps/mobile/lib/hubTabNavigation.ts"
      - "apps/mobile/lib/hubTabNavigation.test.ts"
      - "apps/mobile/components/screens/OsRepairHubScreen.tsx"
      - "apps/mobile/app/_layout.tsx"
      - "scripts/typecheck-mobile.sh"
      - "scripts/typecheck-mobile-report.mjs"
      - ".github/workflows/mobile-hub-navigation-integrity.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-hub-navigation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hub-navigation-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install workspace dependencies
        run: npm ci
      - name: Verify navigation mount-race contracts
        run: |
          set -euo pipefail
          export TSX_TSCONFIG_PATH="$PWD/apps/mobile/tsconfig.json"
          npx tsx apps/mobile/lib/hubTabNavigation.test.ts
      - name: Run fail-closed mobile TypeScript integrity
        run: npm run typecheck:mobile
      - name: Reject unsafe hub URL synchronization
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          hook = Path("apps/mobile/lib/useHubTab.ts").read_text(encoding="utf-8")
          required = [
              "useNavigationContainerRef",
              "isHubNavigationReady(navigationRef)",
              "HUB_TAB_SYNC_RETRY_DELAYS_MS",
              "pendingTabRef",
              "isRootLayoutMountRace(error)",
              "router.setParams({ tab: pendingTab })",
          ]
          missing = [token for token in required if token not in hook]
          if missing:
              raise SystemExit(f"safe hub navigation contract missing: {missing}")
          if "useRootNavigationState" in hook:
              raise SystemExit("root state is not sufficient navigation readiness")
          if "import { router," in hook:
              raise SystemExit("global router singleton remains in useHubTab")
          print("mobile hub navigation source contract OK")
          PY
