name: Document recovery integrity

on:
  pull_request:
    paths:
      - 'backend/app/api/v1/document_creation_integrity.py'
      - 'backend/app/api/v1/document_upload_integrity.py'
      - 'backend/app/api/v1/documents.py'
      - 'backend/app/api/v1/router.py'
      - 'backend/app/services/document_upload_storage.py'
      - 'backend/tests/test_document_creation_idempotency.py'
      - 'backend/tests/test_document_upload_recovery_integrity.py'
      - 'apps/mobile/lib/api/documents.ts'
      - 'apps/mobile/lib/api/documentMetadataRecovery.test.ts'
      - 'apps/mobile/lib/api/documentUploadRecovery.test.ts'
      - 'apps/mobile/lib/api/failurePolicy.ts'
      - '.github/workflows/document-recovery-integrity.yml'
  push:
    branches: [main]
    paths:
      - 'backend/app/api/v1/document_creation_integrity.py'
      - 'backend/app/api/v1/document_upload_integrity.py'
      - 'backend/app/api/v1/router.py'
      - 'backend/app/services/document_upload_storage.py'
      - 'backend/tests/test_document_creation_idempotency.py'
      - 'backend/tests/test_document_upload_recovery_integrity.py'
      - 'apps/mobile/lib/api/documents.ts'
      - 'apps/mobile/lib/api/documentMetadataRecovery.test.ts'
      - 'apps/mobile/lib/api/documentUploadRecovery.test.ts'
      - '.github/workflows/document-recovery-integrity.yml'

concurrency:
  group: document-recovery-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  document-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt
      - name: Install workspace dependencies
        run: npm ci
      - name: Backend document metadata and upload exactly-once integrity
        working-directory: backend
        run: pytest -q tests/test_document_creation_idempotency.py tests/test_document_upload_recovery_integrity.py
      - name: Mobile typecheck
        run: npm run typecheck:mobile
      - name: Mobile metadata response-loss identity
        run: |
          export TSX_TSCONFIG_PATH="$PWD/apps/mobile/tsconfig.json"
          npx tsx apps/mobile/lib/api/documentMetadataRecovery.test.ts
      - name: Mobile upload bounded replay identity
        run: |
          export TSX_TSCONFIG_PATH="$PWD/apps/mobile/tsconfig.json"
          npx tsx apps/mobile/lib/api/documentUploadRecovery.test.ts
