name: Runtime topology integrity

on:
  pull_request:
    paths:
      - "backend/Dockerfile"
      - "backend/docker/**"
      - "backend/app/main.py"
      - "backend/app/worker_main.py"
      - "backend/app/runtime_healthcheck.py"
      - "backend/app/core/observability.py"
      - "backend/app/api/v1/admin.py"
      - "backend/app/api/v1/automation_worker.py"
      - "backend/app/services/outbox_worker.py"
      - "backend/app/services/push_receipt_worker.py"
      - "backend/app/services/provider_reconciliation_worker.py"
      - "backend/app/services/automation_reminders_worker.py"
      - "backend/app/services/runtime_topology.py"
      - "backend/tests/test_runtime_topology_integrity.py"
      - "scripts/runtime-topology-smoke.sh"
      - ".github/workflows/runtime-topology-integrity.yml"
  push:
    branches: [main]
    paths:
      - "backend/Dockerfile"
      - "backend/docker/**"
      - "backend/app/main.py"
      - "backend/app/worker_main.py"
      - "backend/app/runtime_healthcheck.py"
      - "backend/app/services/provider_reconciliation_worker.py"
      - "backend/app/services/runtime_topology.py"
      - "scripts/runtime-topology-smoke.sh"
      - ".github/workflows/runtime-topology-integrity.yml"
  workflow_dispatch:

concurrency:
  group: runtime-topology-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  same-image-failure-domains:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      RUNTIME_TOPOLOGY_IMAGE: renova-backend:topology-ci
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-buildx-action@v4.2.0
      - name: Validate source and unit topology contracts
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/runtime-topology-smoke.sh
          python -m py_compile \
            backend/app/worker_main.py \
            backend/app/runtime_healthcheck.py \
            backend/app/services/provider_reconciliation_worker.py \
            backend/app/services/runtime_topology.py
      - name: Build exact same-image topology artifact
        shell: bash
        run: |
          set -euo pipefail
          docker build \
            --build-arg "VCS_REF=${GITHUB_SHA}" \
            -f backend/Dockerfile \
            -t "$RUNTIME_TOPOLOGY_IMAGE" \
            .
      - name: Run two-API one-worker topology and failure smoke
        shell: bash
        run: bash scripts/runtime-topology-smoke.sh
      - name: Upload topology diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-topology-diagnostics
          if-no-files-found: ignore
          retention-days: 14
          path: |
            /tmp/renova-runtime-topology-migrate.log
            /tmp/renova-runtime-topology-api-a.json
            /tmp/renova-runtime-topology-api-b.json
