name: Observability lock generator

on:
  push:
    branches:
      - agent/observability-oncall-integrity
    paths:
      - "backend/pyproject.toml"
      - ".github/workflows/observability-lock-generator.yml"

permissions:
  contents: write

jobs:
  generate-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/observability-oncall-integrity
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.13"
      - name: Install exact Poetry toolchain
        run: python -m pip install --disable-pip-version-check "poetry==2.4.1"
      - name: Generate lockfile from reviewed manifest
        working-directory: backend
        run: |
          set -euo pipefail
          poetry lock
          poetry check --lock
      - name: Commit generated lockfile
        run: |
          set -euo pipefail
          if git diff --quiet -- backend/poetry.lock; then
            echo "poetry.lock already current"
            exit 0
          fi
          git config user.name "renova-ci"
          git config user.email "renova-ci@users.noreply.github.com"
          git add backend/poetry.lock
          git commit -m "Lock observability runtime dependencies"
          git push origin HEAD:agent/observability-oncall-integrity
