name: Session authority integrity

on:
  pull_request:
    paths:
      - 'apps/mobile/lib/sessionAuthority.ts'
      - 'apps/mobile/lib/sessionAuthority.test.ts'
      - 'apps/mobile/lib/sessionTransportFence.test.ts'
      - 'apps/mobile/lib/offlineSessionFence.test.ts'
      - 'apps/mobile/lib/api/client.ts'
      - 'apps/mobile/lib/api/auth.ts'
      - 'apps/mobile/lib/offlineQueue.ts'
      - 'apps/mobile/lib/context/RenovaContext.tsx'
      - 'apps/mobile/lib/sessionBootstrap.ts'
      - 'apps/mobile/constants/sessionKeys.ts'
      - 'backend/app/api/v1/auth.py'
      - 'backend/app/services/session_service.py'
      - 'backend/tests/test_session_refresh.py'
      - '.github/workflows/session-authority-integrity.yml'
  push:
    branches: [main]
    paths:
      - 'apps/mobile/lib/sessionAuthority.ts'
      - 'apps/mobile/lib/api/client.ts'
      - 'apps/mobile/lib/offlineQueue.ts'
      - 'apps/mobile/lib/context/RenovaContext.tsx'
      - 'backend/app/api/v1/auth.py'
      - 'backend/app/services/session_service.py'
      - '.github/workflows/session-authority-integrity.yml'

concurrency:
  group: session-authority-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  session-authority:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install workspace dependencies
        run: npm ci
      - name: Fail-closed mobile TypeScript integrity
        run: npm run typecheck:mobile
      - name: Prove A-B-A authority generation semantics
        run: |
          export TSX_TSCONFIG_PATH="$PWD/apps/mobile/tsconfig.json"
          npx tsx apps/mobile/lib/sessionAuthority.test.ts
      - name: Prove late request and refresh cannot cross login generation
        run: |
          export TSX_TSCONFIG_PATH="$PWD/apps/mobile/tsconfig.json"
          npx tsx apps/mobile/lib/sessionTransportFence.test.ts
      - name: Prove offline jobs never cross login provenance
        run: |
          export TSX_TSCONFIG_PATH="$PWD/apps/mobile/tsconfig.json"
          npx tsx apps/mobile/lib/offlineSessionFence.test.ts
