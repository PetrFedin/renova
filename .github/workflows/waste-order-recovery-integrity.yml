name: Waste order recovery integrity

on:
  pull_request:
    paths:
      - 'backend/app/api/v1/waste_order_creation_integrity.py'
      - 'backend/app/api/v1/waste_orders.py'
      - 'backend/app/api/v1/router.py'
      - 'backend/app/services/waste_order_service.py'
      - 'backend/tests/test_waste_order_recovery_integrity.py'
      - 'apps/mobile/lib/api/floor.ts'
      - 'apps/mobile/lib/api/wasteOrderRecovery.test.ts'
      - 'apps/mobile/lib/api/failurePolicy.ts'
      - '.github/workflows/waste-order-recovery-integrity.yml'
  push:
    branches: [main]
    paths:
      - 'backend/app/api/v1/waste_order_creation_integrity.py'
      - 'backend/app/api/v1/router.py'
      - 'backend/tests/test_waste_order_recovery_integrity.py'
      - 'apps/mobile/lib/api/floor.ts'
      - 'apps/mobile/lib/api/wasteOrderRecovery.test.ts'
      - '.github/workflows/waste-order-recovery-integrity.yml'

concurrency:
  group: waste-order-recovery-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  waste-order-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt
      - name: Install workspace dependencies
        run: npm ci
      - name: Backend create and transition integrity
        working-directory: backend
        run: pytest -q tests/test_waste_order_recovery_integrity.py
      - name: Mobile typecheck
        run: npm run typecheck:mobile
      - name: Mobile response-loss transition policy
        run: |
          export TSX_TSCONFIG_PATH="$PWD/apps/mobile/tsconfig.json"
          npx tsx apps/mobile/lib/api/wasteOrderRecovery.test.ts
