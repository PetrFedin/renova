name: Temporary finalize schema contracts

on:
  pull_request:
    paths:
      - ".github/workflows/temporary-schema-contract-finalize.yml"

permissions:
  contents: read

jobs:
  finalize-schema-contracts:
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/database-restore-drill' && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/database-restore-drill
          fetch-depth: 0
      - name: Apply reviewed schema contract updates
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path_str: str, old: str, new: str) -> None:
              path = Path(path_str)
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one reviewed replacement, found {count}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'backend/scripts/verify_migration_schema.py',
              '_PRESENT_REVISION = "w12pushreceipt01"',
              '_PRESENT_REVISION = "w13ormparity01"',
          )
          replace_once(
              'backend/tests/test_database_revision_guard.py',
              '        "w12pushreceipt01",\n',
              '        "w13ormparity01",\n',
          )
          replace_once(
              'backend/scripts/verify_orm_schema_parity.py',
              '# Import every mapped-model module used by the application before reading metadata.\n'
              'import app.models.client_write_request  # noqa: F401,E402\n'
              'import app.models.entities  # noqa: F401,E402\n'
              'import app.models.outbox_runtime  # noqa: F401,E402\n'
              'import app.models.project_documents  # noqa: F401,E402\n'
              'import app.models.webhook_runtime  # noqa: F401,E402\n'
              'import app.models.work_schedule  # noqa: F401,E402\n',
              '# Import the canonical package registry before reading metadata.\n'
              'import app.models  # noqa: F401,E402\n',
          )
          PY
          git diff --check -- \
            backend/scripts/verify_migration_schema.py \
            backend/tests/test_database_revision_guard.py \
            backend/scripts/verify_orm_schema_parity.py
      - name: Commit reviewed regular-file updates
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Renova CI"
          git config user.email "81327591+PetrFedin@users.noreply.github.com"
          git add -- \
            backend/scripts/verify_migration_schema.py \
            backend/tests/test_database_revision_guard.py \
            backend/scripts/verify_orm_schema_parity.py
          git diff --cached --check
          git commit -m "Make w13 schema parity the production contract"
          git push origin HEAD:agent/database-restore-drill
