name: Apply reviewed XML parser patch
on:
  push:
    branches: ["fix/chat-business-command-idempotency"]
    paths: [".github/workflows/agent-qualify-xmldom.yml"]
permissions:
  contents: write
jobs:
  exact-patch:
    if: github.repository == 'PetrFedin/renova' && github.actor == 'PetrFedin'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20.20.2" }
      - name: Apply two-entry patch from retained npm metadata
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/fix/chat-business-command-idempotency | cut -f1)" = "$EXPECTED_SHA"
          test "$(git hash-object package-lock.json)" = 240a566a5ec63ae078a37ea364370c1990b48014
          mkdir -p .artifacts/xml-patch
          node - <<'NODE'
          const fs = require('fs'), assert = require('assert/strict');
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          // Exact registry metadata retained in artifact 10080336014.
          for (const [location, previous, version, integrity] of [
            ['node_modules/@xmldom/xmldom','0.8.13','0.8.15','sha512-/5NV/vDALVFDXgLmfsy9TRCBlKwO2LNBFzpzvb9iIj+jR+eSc6DLYYvVOdivT/jm7MtU6TebYuRmzEOI7w40UA=='],
            ['node_modules/plist/node_modules/@xmldom/xmldom','0.9.10','0.9.12','sha512-5AXjrcMClTryPe9LgZrygpB1lj7s0S9E0+W+AHaVKAVyHanafK86iPSvG5xHVSp/jC+VH1UXu0TAEmY279xH7A=='],
          ]) {
            assert.equal(lock.packages[location].version, previous);
            Object.assign(lock.packages[location], { version, resolved: `https://registry.npmjs.org/@xmldom/xmldom/-/xmldom-${version}.tgz`, integrity });
          }
          fs.writeFileSync('package-lock.json', JSON.stringify(lock, null, 2) + '\n');
          NODE
      - name: Locked real-consumer and transport regression
        run: |
          set -euo pipefail
          npm ci
          node scripts/xmldomIntegrity.test.mjs
          node scripts/chatBusinessCommandTransport.test.mjs
          set +e
          npm audit --omit=dev --json > .artifacts/xml-patch/npm-audit-production.json
          set -e
          node scripts/check-npm-audit-baseline.mjs .artifacts/xml-patch/npm-audit-production.json
      - name: Validate and publish only the two-entry lock patch
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/fix/chat-business-command-idempotency | cut -f1)" = "$EXPECTED_SHA"
          python - <<'PY'
          import json,pathlib,subprocess
          old=json.loads(subprocess.check_output(['git','show','HEAD:package-lock.json']))
          new=json.loads(pathlib.Path('package-lock.json').read_text())
          targets={'node_modules/@xmldom/xmldom','node_modules/plist/node_modules/@xmldom/xmldom'}
          assert old.keys()==new.keys() and old['packages'].keys()==new['packages'].keys()
          for key in old:
              if key!='packages': assert old[key]==new[key]
          for key,value in old['packages'].items():
              if key not in targets: assert new['packages'][key]==value,key
              else:
                  assert value.keys()==new['packages'][key].keys()
                  for field in value:
                      if field not in {'version','resolved','integrity'}: assert value[field]==new['packages'][key][field]
          assert subprocess.check_output(['git','diff','--name-only'],text=True).splitlines()==['package-lock.json']
          PY
          git add -- package-lock.json
          git diff --cached --check
          git config user.name 'Renova reviewed-dependency automation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(deps): patch two XML parser copies without broad dependency churn'
          git push origin HEAD:refs/heads/fix/chat-business-command-idempotency
      - name: Retain diagnostic source and proposed lock
        if: always()
        run: |
          git archive --format=tar --output=.artifacts/xml-patch/renova-source.tar HEAD
          cp package-lock.json .artifacts/xml-patch/proposed-package-lock.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xml-patch-qualification
          path: .artifacts/xml-patch/
          retention-days: 3
