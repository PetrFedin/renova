name: Calendar integrity

on: [push, pull_request]

concurrency:
  group: calendar-integrity-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  calendar-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ENVIRONMENT: test
      DATABASE_URL: sqlite+aiosqlite:///./calendar-integrity-tests.db
      PUBLIC_BASE_URL: http://127.0.0.1:8100
      SECRET_KEY: ci-secret-key-at-least-16
      ALLOW_CREATE_ALL: "true"
      ALLOW_DEMO_SEED: "true"
      PYTHONHASHSEED: "0"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Set up locked backend environment
        uses: ./.github/actions/setup-backend
      - name: Calendar read mutation ACL and replay contracts
        working-directory: backend
        run: |
          set -o pipefail
          timeout 300s poetry run pytest -vv -s --tb=short \
            tests/test_calendar_integrity.py \
            tests/test_calendar_mutation_integrity.py \
            tests/test_calendar_revoked_access.py \
            2>&1 | tee calendar-integrity-contracts.log
      - name: Upload calendar integrity diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calendar-integrity-contract-diagnostics
          path: backend/calendar-integrity-contracts.log
          if-no-files-found: warn
          retention-days: 14
