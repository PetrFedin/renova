name: JS dependency discovery

on:
  push:
    branches:
      - agent/js-dependency-supply-chain-hardening
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: js-dependency-discovery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  resolve-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/js-dependency-supply-chain-hardening
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Resolve exact tsx development dependency
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts --save-dev --save-exact tsx@4.23.12
      - name: Persist npm-generated package metadata
        run: |
          set -euo pipefail
          if git diff --quiet -- package.json package-lock.json; then
            echo "package metadata already canonical"
            exit 0
          fi
          git config user.name "renova-ci"
          git config user.email "renova-ci@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "Pin tsx in reviewed package lock"
          git push origin HEAD:agent/js-dependency-supply-chain-hardening
      - name: Capture dependency audits
        run: |
          set +e
          npm audit --json > npm-audit-full.json
          full_status=$?
          npm audit --omit=dev --json > npm-audit-production.json
          prod_status=$?
          set -e
          node - <<'NODE'
          const fs = require('fs');
          for (const file of ['npm-audit-full.json', 'npm-audit-production.json']) {
            const report = JSON.parse(fs.readFileSync(file, 'utf8'));
            const v = report.metadata?.vulnerabilities || {};
            console.log(`${file}: total=${v.total ?? 'n/a'} critical=${v.critical ?? 'n/a'} high=${v.high ?? 'n/a'} moderate=${v.moderate ?? 'n/a'} low=${v.low ?? 'n/a'}`);
          }
          NODE
          echo "full_audit_exit=$full_status"
          echo "production_audit_exit=$prod_status"
      - name: Upload generated lock and audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: js-dependency-discovery
          path: |
            package.json
            package-lock.json
            npm-audit-full.json
            npm-audit-production.json
          if-no-files-found: error
          retention-days: 7
