name: Backend lock discovery

on:
  push:
    branches:
      - agent/backend-dependency-reproducibility

permissions:
  contents: write

jobs:
  generate-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/backend-dependency-reproducibility
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.13"
      - name: Install exact Poetry toolchain
        run: python -m pip install --disable-pip-version-check "poetry==2.4.1"
      - name: Generate Poetry lockfile
        working-directory: backend
        run: |
          set -euo pipefail
          poetry --version
          python --version
          poetry lock
          poetry check --lock
      - name: Commit generated lockfile
        run: |
          set -euo pipefail
          if git diff --quiet -- backend/poetry.lock && git ls-files --error-unmatch backend/poetry.lock >/dev/null 2>&1; then
            echo "backend/poetry.lock is already current"
            exit 0
          fi
          git config user.name "renova-ci"
          git config user.email "renova-ci@users.noreply.github.com"
          git add backend/poetry.lock
          git commit -m "Generate backend Poetry lockfile"
          git push origin HEAD:agent/backend-dependency-reproducibility
