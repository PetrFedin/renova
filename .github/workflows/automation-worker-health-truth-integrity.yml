name: Automation worker health truth integrity

on:
  pull_request:
    paths:
      - "backend/app/api/v1/automation_worker.py"
      - "backend/app/services/automation_reminders_worker.py"
      - "backend/tests/test_automation_worker_health_truth.py"
      - "backend/tests/test_outbox_ops_alert_integrity.py"
      - "backend/tests/test_admin_rbac_integrity.py"
      - ".github/workflows/automation-worker-health-truth-integrity.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: automation-worker-health-truth-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  worker-health-truth-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ENVIRONMENT: test
      DATABASE_URL: sqlite+aiosqlite:///./automation-worker-health-truth.db
      PUBLIC_BASE_URL: http://127.0.0.1:8100
      SECRET_KEY: ci-secret-key-at-least-16
      ALLOW_CREATE_ALL: "true"
      ALLOW_DEMO_SEED: "true"
      AUTOMATION_REMINDERS_ENABLED: "0"
      OPS_ALERT_EMAIL: ops@example.com
      PYTHONHASHSEED: "0"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install focused backend dependencies
        working-directory: backend
        run: |
          set -euo pipefail
          pip install poetry
          poetry install --no-interaction
          poetry run pip install fpdf2 alembic
      - name: Reject failure-only worker health
        working-directory: backend
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path("app/api/v1/automation_worker.py").read_text(encoding="utf-8")
          required = [
              "outbox_status",
              "tick_executed",
              "outbox_healthy",
              "_worker_runtime_truth",
          ]
          missing = [token for token in required if token not in source]
          if missing:
              raise SystemExit(f"worker health truth contract missing: {missing}")
          print("automation worker health truth scan OK")
          PY
      - name: Verify worker status and tick truth contracts
        working-directory: backend
        run: |
          set -o pipefail
          timeout 480s poetry run pytest -vv -s --tb=short \
            tests/test_automation_worker_health_truth.py \
            tests/test_outbox_ops_alert_integrity.py \
            tests/test_admin_rbac_integrity.py \
            2>&1 | tee automation-worker-health-truth-integrity.log
      - name: Upload worker health diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: automation-worker-health-truth-integrity-diagnostics
          path: backend/automation-worker-health-truth-integrity.log
          if-no-files-found: warn
          retention-days: 14
