name: CI

on: [push, pull_request]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  mobile-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install workspace dependencies
        run: npm ci
      - name: Mobile TypeScript integrity
        run: npm run typecheck:mobile
      - name: Mobile domain and UI contracts
        run: npm run mobile:test
      - name: Mobile runtime and persistence contracts
        run: |
          set -euo pipefail
          npm run test:offline
          npm run test:routes
          npm run test:docs-meta
          npm run test:docs-upload
          npm run testflight:eas

  chat-message-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: renova
          POSTGRES_PASSWORD: renova
          POSTGRES_DB: renova_chat_integrity
        ports: ["5436:5432"]
        options: >-
          --health-cmd "pg_isready -U renova -d renova_chat_integrity"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ENVIRONMENT: test
      DATABASE_URL: sqlite+aiosqlite:///./chat-message-integrity.db
      CHAT_MESSAGE_POSTGRES_URL: postgresql+asyncpg://renova:renova@127.0.0.1:5436/renova_chat_integrity
      PUBLIC_BASE_URL: http://127.0.0.1:8100
      SECRET_KEY: ci-secret-key-at-least-16
      ALLOW_CREATE_ALL: "true"
      ALLOW_DEMO_SEED: "false"
      PYTHONHASHSEED: "0"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.13"
      - name: Install locked backend dependencies
        working-directory: backend
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check "poetry==2.4.1"
          poetry check --lock
          poetry sync --no-interaction
          poetry run python -m pip check
      - name: Upgrade dedicated PostgreSQL race database
        working-directory: backend
        run: |
          set -euo pipefail
          DATABASE_URL="$CHAT_MESSAGE_POSTGRES_URL" poetry run alembic upgrade head
      - name: Run chat atomicity, ACL, reconciliation and PostgreSQL race contracts
        working-directory: backend
        run: |
          set -euo pipefail
          poetry run pytest -q \
            tests/test_chat_message_atomicity.py \
            tests/test_chat_message_postgres_concurrency.py \
            tests/test_chat_participant_message_delivery.py \
            tests/test_chat_reconciliation_contract.py \
            tests/test_chat_thread_only_acl_contract.py \
            tests/test_chat_thread_only_mobile_capabilities_contract.py \
            tests/test_chat_thread_only_mobile_inbox_contract.py

  project-creation-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ENVIRONMENT: test
      DATABASE_URL: sqlite+aiosqlite:///./project-create-tests.db
      PUBLIC_BASE_URL: http://127.0.0.1:8100
      SECRET_KEY: ci-secret-key-at-least-16
      ALLOW_CREATE_ALL: "true"
      ALLOW_DEMO_SEED: "true"
      PYTHONHASHSEED: "0"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.13"
      - name: Install locked backend dependencies
        working-directory: backend
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check "poetry==2.4.1"
          poetry sync --no-interaction
      - name: Project creation atomicity contracts
        working-directory: backend
        run: |
          set -o pipefail
          timeout 240s poetry run pytest -vv -s --tb=short tests/test_project_create_atomicity.py 2>&1 | tee project-create-contracts.log
      - name: Upload project creation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: project-creation-contract-diagnostics
          path: backend/project-create-contracts.log
          if-no-files-found: warn
          retention-days: 14

  acceptance-decision-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ENVIRONMENT: test
      DATABASE_URL: sqlite+aiosqlite:///./acceptance-decision-tests.db
      PUBLIC_BASE_URL: http://127.0.0.1:8100
      SECRET_KEY: ci-secret-key-at-least-16
      ALLOW_CREATE_ALL: "true"
      ALLOW_DEMO_SEED: "true"
      PYTHONHASHSEED: "0"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.13"
      - name: Install locked backend dependencies
        working-directory: backend
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check "poetry==2.4.1"
          poetry sync --no-interaction
      - name: Work acceptance decision contracts
        working-directory: backend
        run: |
          set -o pipefail
          timeout 240s poetry run pytest -vv -s --tb=short tests/test_work_acceptance_decision_integrity*.py 2>&1 | tee acceptance-decision-contracts.log
      - name: Upload acceptance decision diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-decision-contract-diagnostics
          path: backend/acceptance-decision-contracts.log
          if-no-files-found: warn
          retention-days: 14

  stage-mutation-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ENVIRONMENT: test
      DATABASE_URL: sqlite+aiosqlite:///./stage-mutation-tests.db
      PUBLIC_BASE_URL: http://127.0.0.1:8100
      SECRET_KEY: ci-secret-key-at-least-16
      ALLOW_CREATE_ALL: "true"
      ALLOW_DEMO_SEED: "true"
      PYTHONHASHSEED: "0"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.13"
      - name: Install locked backend dependencies
        working-directory: backend
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check "poetry==2.4.1"
          poetry sync --no-interaction
      - name: Stage mutation integrity contracts
        working-directory: backend
        run: |
          set -o pipefail
          timeout 240s poetry run pytest -vv -s --tb=short tests/test_stage_mutation_integrity*.py 2>&1 | tee stage-mutation-contracts.log
      - name: Upload stage mutation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage-mutation-contract-diagnostics
          path: backend/stage-mutation-contracts.log
          if-no-files-found: warn
          retention-days: 14

  team-lifecycle-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ENVIRONMENT: test
      DATABASE_URL: sqlite+aiosqlite:///./team-lifecycle-tests.db
      PUBLIC_BASE_URL: http://127.0.0.1:8100
      SECRET_KEY: ci-secret-key-at-least-16
      ALLOW_CREATE_ALL: "true"
      ALLOW_DEMO_SEED: "true"
      PYTHONHASHSEED: "0"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.13"
      - name: Install locked backend dependencies
        working-directory: backend
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check "poetry==2.4.1"
          poetry sync --no-interaction
      - name: Team lifecycle integrity contracts
        working-directory: backend
        run: |
          set -o pipefail
          timeout 240s poetry run pytest -vv -s --tb=short tests/test_team_invite_atomicity.py tests/test_team_lifecycle_integrity.py 2>&1 | tee team-lifecycle-contracts.log
      - name: Upload team lifecycle diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: team-lifecycle-contract-diagnostics
          path: backend/team-lifecycle-contracts.log
          if-no-files-found: warn
          retention-days: 14

  backend-complete:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: renova
          POSTGRES_PASSWORD: renova
          POSTGRES_DB: renova
        ports: ["5433:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      ENVIRONMENT: test
      DATABASE_URL: sqlite+aiosqlite:///./ci-tests.db
      PUBLIC_BASE_URL: http://127.0.0.1:8100
      SECRET_KEY: ci-secret-key-at-least-16
      ALLOW_CREATE_ALL: "true"
      ALLOW_DEMO_SEED: "true"
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.13"
      - name: Install locked backend dependencies
        working-directory: backend
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check "poetry==2.4.1"
          poetry sync --no-interaction
      - name: Full backend test suite
        working-directory: backend
        run: |
          set -o pipefail
          poetry run pytest --tb=short -ra --junitxml=pytest-results.xml 2>&1 | tee pytest-full.log
      - name: Publish backend test summary
        if: always()
        working-directory: backend
        run: |
          {
            echo "## Backend full regression"
            if [ -f pytest-full.log ]; then
              echo '```text'
              grep -E '^(FAILED|ERROR) |^=+ .* (failed|error|errors)' pytest-full.log | tail -n 200 || tail -n 200 pytest-full.log
              echo '```'
            else
              echo "The pytest log was not created. Inspect the dependency-installation step."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload backend test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-diagnostics
          path: |
            backend/pytest-full.log
            backend/pytest-results.xml
          if-no-files-found: warn
          retention-days: 14
      - name: Alembic upgrade on PostgreSQL
        if: success()
        working-directory: backend
        env:
          ENVIRONMENT: staging
          DATABASE_URL: postgresql+asyncpg://renova:renova@127.0.0.1:5433/renova
          PUBLIC_BASE_URL: https://ci-staging.example.com
          SECRET_KEY: ci-staging-signing-key-at-least-32-bytes
          ALLOW_CREATE_ALL: "false"
          ALLOW_DEMO_SEED: "false"
        run: poetry run python -m alembic upgrade head

  playwright-api-and-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.13"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install test dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check "poetry==2.4.1"
          cd backend
          poetry sync --no-interaction
          cd ..
          npm ci
          npx playwright install --with-deps chromium
      - name: Verify bearer-auth E2E contract
        run: bash scripts/assert-e2e-bearer.sh
      - name: Run API and complete browser surface E2E
        run: bash scripts/ci-playwright.sh all
