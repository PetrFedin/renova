  backend-complete:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: renova
          POSTGRES_PASSWORD: renova
          POSTGRES_DB: renova
        ports: ["5433:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      ENVIRONMENT: test
      DATABASE_URL: sqlite+aiosqlite:///./ci-tests.db
      PUBLIC_BASE_URL: http://127.0.0.1:8100
      SECRET_KEY: ci-${{ github.sha }}
      ALLOW_CREATE_ALL: "true"
      ALLOW_DEMO_SEED: "true"
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.13"
      - name: Install locked backend dependencies
        working-directory: backend
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check "poetry==2.4.1"
          poetry sync --no-interaction
      - name: Full backend test suite
        working-directory: backend
        run: |
          set -o pipefail
          poetry run pytest --tb=short -ra --junitxml=pytest-results.xml 2>&1 | tee pytest-full.log
      - name: Publish backend test summary
        if: always()
        working-directory: backend
        run: |
          {
            echo "## Backend full regression"
            if [ -f pytest-full.log ]; then
              echo '```text'
              grep -E '^(FAILED|ERROR) |^=+ .* (failed|error|errors)' pytest-full.log | tail -n 200 || tail -n 200 pytest-full.log
              echo '```'
            else
              echo "The pytest log was not created. Inspect the dependency-installation step."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload backend test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-diagnostics
          path: |
            backend/pytest-full.log
            backend/pytest-results.xml
          if-no-files-found: warn
          retention-days: 14
      - name: Alembic upgrade on PostgreSQL
        if: success()
        working-directory: backend
        env:
          ENVIRONMENT: staging
          DATABASE_URL: postgresql+asyncpg://renova:renova@127.0.0.1:5433/renova
          PUBLIC_BASE_URL: https://ci-staging.example.com
          SECRET_KEY: ci-staging-signing-key-at-least-32-bytes
          ALLOW_CREATE_ALL: "false"
          ALLOW_DEMO_SEED: "false"
        run: poetry run python -m alembic upgrade head

  playwright-api-and-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.13"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install test dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check "poetry==2.4.1"
          cd backend
          poetry sync --no-interaction
          cd ..
          npm ci
          npx playwright install --with-deps chromium
      - name: Verify bearer-auth E2E contract
        run: bash scripts/assert-e2e-bearer.sh
      - name: Run API and complete browser surface E2E
        run: bash scripts/ci-playwright.sh all
