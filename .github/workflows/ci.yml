name: CI

on: [push, pull_request]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  mobile-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install workspace dependencies
        run: npm ci
      - name: Mobile TypeScript integrity
        run: npm run typecheck:mobile
      - name: Mobile domain and UI contracts
        run: npm run mobile:test
      - name: Furniture production transport and restart contract
        run: |
          set -euo pipefail
          node scripts/furnitureTransport.test.mjs
      - name: Waste-order production transport and restart contract
        run: |
          set -euo pipefail
          node scripts/wasteOrderTransport.test.mjs
      - name: Mobile runtime and persistence contracts
        run: |
          set -euo pipefail
          npm run test:offline
          npm run test:routes
          npm run test:docs-meta
          npm run test:docs-upload
          npm run testflight:eas

  chat-message-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: renova
          POSTGRES_PASSWORD: renova
          POSTGRES_DB: renova_chat_integrity
        ports: ["5436:5432"]
        options: >-
          --health-cmd "pg_isready -U renova -d renova_chat_integrity"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ENVIRONMENT: test
      DATABASE_URL: sqlite+aiosqlite:///./chat-message-integrity.db
      CHAT_MESSAGE_POSTGRES_URL: postgresql+asyncpg://renova:renova@127.0.0.1:5436/renova_chat_integrity
      FURNITURE_CREATE_POSTGRES_URL: postgresql+asyncpg://renova:renova@127.0.0.1:5436/renova_chat_integrity
      FLOOR_OBJECT_BINDING_POSTGRES_URL: postgresql+asyncpg://renova:renova@127.0.0.1:5436/renova_chat_integrity
      WASTE_ORDER_POSTGRES_URL: postgresql+asyncpg://renova:renova@127.0.0.1:5436/renova_chat_integrity
      PUBLIC_BASE_URL: http://127.0.0.1:8100
      SECRET_KEY: ci-${{ github.sha }}
      ALLOW_CREATE_ALL: "true"
      ALLOW_DEMO_SEED: "false"
      PYTHONHASHSEED: "0"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.13"
      - name: Install locked backend dependencies
        working-directory: backend
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check "poetry==2.4.1"
          poetry check --lock
          poetry sync --no-interaction
          poetry run python -m pip check
      - name: Upgrade dedicated PostgreSQL race database
        working-directory: backend
        run: |
          set -euo pipefail
          DATABASE_URL="$CHAT_MESSAGE_POSTGRES_URL" poetry run alembic upgrade head
      - name: Run chat atomicity, ACL, reconciliation and PostgreSQL race contracts
        working-directory: backend
        run: |
          set -euo pipefail
          poetry run pytest -q \
            tests/test_chat_message_atomicity.py \
            tests/test_chat_message_postgres_concurrency.py \
            tests/test_chat_participant_message_delivery.py \
            tests/test_chat_reconciliation_contract.py \
            tests/test_chat_thread_only_acl_contract.py \
            tests/test_chat_thread_only_mobile_capabilities_contract.py \
            tests/test_chat_thread_only_mobile_inbox_contract.py
      - name: Run fail-closed furniture recovery and floor binding contracts
        working-directory: backend
        run: |
          set -euo pipefail
          poetry run pytest -q \
            tests/test_furniture_create_replay.py \
            --junitxml=furniture-behavioral-results.xml
          poetry run pytest -q \
            tests/test_furniture_create_replay_postgres.py \
            tests/test_floor_plan_object_binding_postgres.py \
            --junitxml=furniture-postgres-results.xml
          poetry run python - <<'PY'
          import xml.etree.ElementTree as ET

          def read_cases(path):
              root = ET.parse(path).getroot()
              cases = root.findall('.//testcase')
              assert cases, f'{path}: qualification must execute tests'
              assert not root.findall('.//skipped'), f'{path}: skipped tests are not qualification evidence'
              assert not root.findall('.//failure'), f'{path}: failing tests are not qualification evidence'
              assert not root.findall('.//error'), f'{path}: errored tests are not qualification evidence'
              return {(case.get('classname', ''), case.get('name', '')) for case in cases}

          behavioral = read_cases('furniture-behavioral-results.xml')
          behavioral_names = {
              name for classname, name in behavioral
              if classname.endswith('test_furniture_create_replay')
          }
          required_behavioral = {
              'test_furniture_create_replays_original_conflicts_on_changed_payload_and_preserves_distinct_intents',
              'test_furniture_create_rolls_back_flushed_item_outbox_and_ledger_then_same_intent_recovers',
          }
          assert required_behavioral <= behavioral_names, 'both exact furniture semantic/rollback scenarios must execute'

          postgres = read_cases('furniture-postgres-results.xml')
          furniture_pg_names = {
              name for classname, name in postgres
              if classname.endswith('test_furniture_create_replay_postgres')
          }
          required_furniture_pg = {
              'test_furniture_create_same_key_postgres_race_reaches_project_lock_and_creates_one_result',
              'test_furniture_create_rechecks_revoked_contractor_after_physical_project_lock_wait',
          }
          assert required_furniture_pg <= furniture_pg_names, 'both exact furniture PostgreSQL scenarios must execute'
          floor_binding_names = {
              name for classname, name in postgres
              if classname.endswith('test_floor_plan_object_binding_postgres')
          }
          assert 'test_floor_object_binding_is_fail_closed_on_postgres' in floor_binding_names, 'floor object binding PostgreSQL scenario must execute'
          PY
      - name: Retain furniture recovery qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: furniture-create-recovery-qualification
          path: |
            backend/furniture-behavioral-results.xml
            backend/furniture-postgres-results.xml
          if-no-files-found: error
          retention-days: 14
      - name: Run fail-closed waste-order recovery contracts
        working-directory: backend
        run: |
          set -euo pipefail
          poetry run pytest -q \
            tests/test_waste_order_create_replay.py \
            tests/test_waste_order_transition_replay.py \
            tests/test_waste_order_lifecycle_integrity.py \
            --junitxml=waste-order-behavioral-results.xml
          poetry run pytest -q \
            tests/test_waste_order_replay_postgres.py \
            --junitxml=waste-order-postgres-results.xml
          poetry run python - <<'PY'
          import xml.etree.ElementTree as ET

          def read_cases(path):
              root = ET.parse(path).getroot()
              cases = root.findall('.//testcase')
              assert cases, f'{path}: qualification must execute tests'
              assert not root.findall('.//skipped'), f'{path}: skipped tests are not qualification evidence'
              assert not root.findall('.//failure'), f'{path}: failing tests are not qualification evidence'
              assert not root.findall('.//error'), f'{path}: errored tests are not qualification evidence'
              return {(case.get('classname', ''), case.get('name', '')) for case in cases}

          behavioral = read_cases('waste-order-behavioral-results.xml')
          required_behavioral = {
              'test_waste_order_create_replays_original_conflicts_changed_payload_preserves_distinct_intents_and_rejects_foreign_room',
              'test_waste_order_create_rolls_back_flushed_order_and_ledger_then_same_intent_recovers',
              'test_waste_same_target_replay_revalidates_target_role_without_duplicate_effects',
              'test_request_is_atomic_and_replay_does_not_duplicate_effects',
          }
          behavioral_names = {name for _classname, name in behavioral}
          assert required_behavioral <= behavioral_names, 'all exact waste-order behavioral scenarios must execute'

          postgres = read_cases('waste-order-postgres-results.xml')
          required_postgres = {
              'test_waste_order_create_same_key_postgres_race_reaches_project_lock_and_creates_one_result',
              'test_waste_order_create_rechecks_revoked_contractor_after_physical_project_lock_wait',
              'test_waste_order_transition_rechecks_revoked_contractor_after_physical_order_lock_wait',
          }
          postgres_names = {
              name for classname, name in postgres
              if classname.endswith('test_waste_order_replay_postgres')
          }
          assert required_postgres <= postgres_names, 'all exact waste-order PostgreSQL scenarios must execute'
          PY
      - name: Retain waste-order recovery qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: waste-order-recovery-qualification
          path: |
            backend/waste-order-behavioral-results.xml
            backend/waste-order-postgres-results.xml
          if-no-files-found: error
          retention-days: 14

  project-creation-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ENVIRONMENT: test
      DATABASE_URL: sqlite+aiosqlite:///./project-create-tests.db
      PUBLIC_BASE_URL: http://127.0.0.1:8100
      SECRET_KEY: ci-${{ github.sha }}
      ALLOW_CREATE_ALL: "true"
      ALLOW_DEMO_SEED: "true"
      PYTHONHASHSEED: "0"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.13"
      - name: Install locked backend dependencies
        working-directory: backend
        run: |
          set -euo pipefail
