name: CI

on: [push, pull_request]

jobs:
  mobile-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install workspace dependencies
        run: npm ci
      - name: Mobile TypeScript integrity
        run: npm run typecheck:mobile
      - name: Mobile domain and UI contracts
        run: npm run mobile:test
      - name: Mobile runtime and persistence contracts
        run: |
          set -euo pipefail
          npm run test:offline
          npm run test:routes
          npm run test:docs-meta
          npm run test:docs-upload
          npm run testflight:eas

  backend-complete:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: renova
          POSTGRES_PASSWORD: renova
          POSTGRES_DB: renova
        ports: ["5433:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      ENVIRONMENT: test
      DATABASE_URL: sqlite+aiosqlite:///./ci-tests.db
      PUBLIC_BASE_URL: http://127.0.0.1:8100
      SECRET_KEY: ci-secret-key-at-least-16
      ALLOW_CREATE_ALL: "false"
      ALLOW_DEMO_SEED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        working-directory: backend
        run: |
          set -euo pipefail
          pip install poetry
          poetry install --no-interaction
          poetry run pip install fpdf2 alembic
      - name: Full backend test suite
        working-directory: backend
        run: poetry run pytest -q
      - name: Alembic upgrade on PostgreSQL
        working-directory: backend
        env:
          ENVIRONMENT: staging
          DATABASE_URL: postgresql+asyncpg://renova:renova@127.0.0.1:5433/renova
          PUBLIC_BASE_URL: https://ci-staging.example.com
          SECRET_KEY: ci-staging-secret-key-32chars!!
          ALLOW_CREATE_ALL: "false"
          ALLOW_DEMO_SEED: "false"
        run: poetry run python -m alembic upgrade head

  playwright-api-and-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install test dependencies
        run: |
          set -euo pipefail
          pip install poetry
          cd backend
          poetry install --no-interaction
          poetry run pip install fpdf2 alembic
          cd ..
          npm ci
          npx playwright install --with-deps chromium
      - name: Verify bearer-auth E2E contract
        run: bash scripts/assert-e2e-bearer.sh
      - name: Run API and complete browser surface E2E
        run: bash scripts/ci-playwright.sh all
