name: Temporary runtime foreman cleanup

on:
  pull_request:
    paths:
      - ".github/workflows/temporary-runtime-foreman-cleanup.yml"

permissions:
  contents: read

jobs:
  cleanup-runtime-foreman:
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/database-restore-drill' && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/database-restore-drill
          fetch-depth: 0
      - name: Apply reviewed document audience cleanup and audit runtime
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('backend/app/services/document_lifecycle_service.py')
          text = path.read_text(encoding='utf-8')
          needle = "                project.foreman_id,\n"
          count = text.count(needle)
          if count != 1:
              raise SystemExit(f'expected one Project.foreman_id document member entry, found {count}')
          path.write_text(text.replace(needle, '', 1), encoding='utf-8')
          PY
          git diff --check -- backend/app/services/document_lifecycle_service.py
          if grep -R -n --include='*.py' -E 'project\.foreman_id' backend/app; then
            echo '::error::stale Project.foreman_id runtime reference remains'
            exit 1
          fi
          echo 'runtime Project.foreman_id audit OK'
      - name: Commit regular-file cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Renova CI"
          git config user.email "81327591+PetrFedin@users.noreply.github.com"
          git add -- backend/app/services/document_lifecycle_service.py
          git diff --cached --check
          git commit -m "Remove stale foreman document audience"
          git push origin HEAD:agent/database-restore-drill
