# Temporary same-repo migration runner; restores this file from main before committing.
name: Backend dependency integrity

on:
  pull_request:
    paths:
      - "backend/pyproject.toml"
      - "backend/poetry.lock"
      - "backend/tests/**"
      - ".github/workflows/backend-dependency-integrity.yml"

concurrency:
  group: backend-dependency-integrity-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  temporary-route-tree-migration:
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/immutable-backend-image' && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/immutable-backend-image
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.13"

      - name: Apply reviewed FastAPI and route-tree compatibility changes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one replacement, found {count}")
              file.write_text(text.replace(old, new, 1))

          replace_once(
              "backend/pyproject.toml",
              'fastapi = "0.141.1"',
              'fastapi = "0.139.2"',
          )

          replace_once(
              "backend/tests/test_calendar_integrity.py",
              "from fastapi import HTTPException\n",
              "from fastapi import HTTPException\nfrom fastapi.routing import iter_route_contexts\n",
          )
          replace_once(
              "backend/tests/test_calendar_integrity.py",
              '''            route\n            for route in app.routes\n            if getattr(route, "path", None) == path\n            and method in (getattr(route, "methods", set()) or set())\n''',
              '''            route\n            for route in iter_route_contexts(app.routes)\n            if route.path == path\n            and method in (route.methods or set())\n''',
          )

          replace_once(
              "backend/tests/test_otp_auth_integrity.py",
              "from fastapi.routing import APIRoute\n",
              "from fastapi.routing import iter_route_contexts\n",
          )
          replace_once(
              "backend/tests/test_otp_auth_integrity.py",
              '''            route\n            for route in app.routes\n            if isinstance(route, APIRoute)\n            and route.path == path\n            and "POST" in route.methods\n''',
              '''            route\n            for route in iter_route_contexts(app.routes)\n            if route.path == path\n            and "POST" in (route.methods or set())\n''',
          )

          replace_once(
              "backend/tests/test_admin_rbac_integrity.py",
              "from fastapi import HTTPException\n",
              "from fastapi import HTTPException\nfrom fastapi.routing import iter_route_contexts\n",
          )
          replace_once(
              "backend/tests/test_admin_rbac_integrity.py",
              '''        for route in admin.router.routes\n        if "GET" in (getattr(route, "methods", set()) or set())\n''',
              '''        for route in iter_route_contexts(admin.router.routes)\n        if "GET" in (route.methods or set())\n''',
          )
          replace_once(
              "backend/tests/test_admin_rbac_integrity.py",
              '''        for route in admin.router.routes\n        if "POST" in (getattr(route, "methods", set()) or set())\n''',
              '''        for route in iter_route_contexts(admin.router.routes)\n        if "POST" in (route.methods or set())\n''',
          )

          replace_once(
              "backend/tests/test_platform_admin_operations_integrity.py",
              "from httpx import ASGITransport, AsyncClient\n",
              "from fastapi.routing import iter_route_contexts\nfrom httpx import ASGITransport, AsyncClient\n",
          )
          replace_once(
              "backend/tests/test_platform_admin_operations_integrity.py",
              '''        route.path\n        for route in app.routes\n        if "GET" in (getattr(route, "methods", set()) or set())\n''',
              '''        route.path\n        for route in iter_route_contexts(app.routes)\n        if "GET" in (route.methods or set())\n''',
          )
          replace_once(
              "backend/tests/test_platform_admin_operations_integrity.py",
              '''        route.path for route in app.routes\n''',
              '''        route.path for route in iter_route_contexts(app.routes)\n''',
          )
          PY

      - name: Resolve only the reviewed FastAPI downgrade
        working-directory: backend
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check "poetry==2.4.1"
          poetry update fastapi starlette --lock --no-interaction
          poetry check --lock
          python - <<'PY'
          from pathlib import Path
          lock = Path('poetry.lock').read_text()
          for package, version in (
              ('fastapi', '0.139.2'),
              ('starlette', '1.6.0'),
              ('python-multipart', '0.0.32'),
          ):
              marker = f'name = "{package}"\nversion = "{version}"'
              if marker not in lock:
                  raise SystemExit(f'locked {package} is not the reviewed {version}')
          PY

      - name: Verify migrated focused contracts
        working-directory: backend
        run: |
          set -euo pipefail
          poetry sync --no-interaction
          poetry run pytest -q \
            tests/test_calendar_integrity.py \
            tests/test_otp_auth_integrity.py \
            tests/test_otp_atomic_consume.py \
            tests/test_admin_rbac_integrity.py \
            tests/test_platform_admin_operations_integrity.py \
            tests/test_admin_identity_deployment_integrity.py \
            tests/test_runtime_preflight_integrity.py \
            tests/test_release_health_truth_integrity.py

      - name: Restore read-only workflow and commit migration
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1 --no-tags
          git show FETCH_HEAD:.github/workflows/backend-dependency-integrity.yml > .github/workflows/backend-dependency-integrity.yml
          git config user.name "Renova CI"
          git config user.email "81327591+PetrFedin@users.noreply.github.com"
          git add \
            backend/pyproject.toml \
            backend/poetry.lock \
            backend/tests/test_calendar_integrity.py \
            backend/tests/test_otp_auth_integrity.py \
            backend/tests/test_admin_rbac_integrity.py \
            backend/tests/test_platform_admin_operations_integrity.py \
            .github/workflows/backend-dependency-integrity.yml
          git diff --cached --check
          git commit -m "Adapt route integrity tests to FastAPI route contexts"
          git push origin HEAD:agent/immutable-backend-image

  locked-backend-contract:
    if: github.event_name != 'pull_request' || github.head_ref != 'agent/immutable-backend-image'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.13"
      - name: Install exact Poetry toolchain
        run: python -m pip install --disable-pip-version-check "poetry==2.4.1"
      - name: Validate repository dependency contract
        run: python scripts/check-backend-dependency-integrity.py
      - name: Verify and install locked graph
        working-directory: backend
        run: |
          set -euo pipefail
          poetry check --lock
          poetry sync --no-interaction
          poetry run python -m pip check
      - name: Verify declared PDF runtime dependency
        working-directory: backend
        run: poetry run pytest -q tests/test_pdf_glyph_integrity.py
