name: Expo web native capability integrity

on:
  pull_request:
    paths:
      - "apps/mobile/app.json"
      - "apps/mobile/app/_layout.tsx"
      - "apps/mobile/lib/nativeNotificationPolicy.ts"
      - "apps/mobile/lib/nativeNotifications.ts"
      - "apps/mobile/lib/expoNativeCapabilityIntegrity.test.ts"
      - "e2e/expo-web-native-capability.spec.ts"
      - "scripts/assert-expo-public-config.mjs"
      - "scripts/ci-playwright.sh"
      - ".github/workflows/expo-web-native-capability-integrity.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: expo-web-native-capability-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capability-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TSX_TSCONFIG_PATH: ${{ github.workspace }}/apps/mobile/tsconfig.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install workspace dependencies
        run: npm ci
      - name: Verify mobile TypeScript
        run: npm run typecheck:mobile
      - name: Verify notification platform and config source contracts
        run: npx tsx apps/mobile/lib/expoNativeCapabilityIntegrity.test.ts
      - name: Resolve and validate public Expo config
        run: |
          set -euo pipefail
          (
            cd apps/mobile
            npx expo config --type public --json > /tmp/renova-expo-public.json 2> /tmp/renova-expo-config.stderr
          )
          cat /tmp/renova-expo-config.stderr
          if grep -E 'Root-level.*expo|Ignoring extra keys' /tmp/renova-expo-config.stderr; then
            echo "FAIL: Expo ignored app config fields"
            exit 1
          fi
          node scripts/assert-expo-public-config.mjs /tmp/renova-expo-public.json
      - name: Validate browser observability spec discovery
        run: >-
          npx playwright test -c e2e/playwright.config.ts
          e2e/expo-web-native-capability.spec.ts
          --list
