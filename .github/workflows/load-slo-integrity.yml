name: Load SLO integrity

on:
  push:
    paths:
      - "load/**"
      - "scripts/loadSloIntegrity.test.mjs"
      - "scripts/external-load-reconciliation.sh"
      - "scripts/external-capacity-sampler.py"
      - "scripts/external-capacity-evaluate.py"
      - "scripts/external-staging-release-smoke.sh"
      - "backend/app/api/v1/admin.py"
      - "backend/app/core/config.py"
      - "backend/app/db/session.py"
      - "backend/app/services/capacity_runtime_service.py"
      - "backend/tests/test_capacity_runtime_integrity.py"
      - ".github/workflows/load-slo-integrity.yml"
      - "docs/LOAD-SLO.md"
  pull_request:
    paths:
      - "load/**"
      - "scripts/loadSloIntegrity.test.mjs"
      - "scripts/external-load-reconciliation.sh"
      - "scripts/external-capacity-sampler.py"
      - "scripts/external-capacity-evaluate.py"
      - "scripts/external-staging-release-smoke.sh"
      - "backend/app/api/v1/admin.py"
      - "backend/app/core/config.py"
      - "backend/app/db/session.py"
      - "backend/app/services/capacity_runtime_service.py"
      - "backend/tests/test_capacity_runtime_integrity.py"
      - ".github/workflows/load-slo-integrity.yml"
      - "docs/LOAD-SLO.md"
  workflow_dispatch:
    inputs:
      scenario:
        description: Production-auth staging scenario
        required: true
        default: smoke
        type: choice
        options:
          - smoke
          - load
          - spike
          - soak
          - websocket
          - webhook-burst
      release_sha:
        description: Exact 40-character Git SHA deployed to staging
        required: true
        type: string
      image_digest:
        description: Exact sha256 backend image digest deployed to staging
        required: true
        type: string
      enable_writes:
        description: Enable bounded chat writes on dedicated load fixtures (required for websocket)
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: load-slo-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  contract:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.2"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.13"
      - name: Read immutable k6 image
        id: k6-image
        shell: bash
        run: |
          set -euo pipefail
          ref="$(tr -d '\r\n' < load/K6_IMAGE)"
          [[ "$ref" =~ ^grafana/k6:2\.1\.0@sha256:[0-9a-f]{64}$ ]]
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      - name: Validate load and SLO source contract
        run: node --test scripts/loadSloIntegrity.test.mjs
        env:
          K6_IMAGE: ${{ steps.k6-image.outputs.ref }}
      - name: Validate operational scripts
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/external-load-reconciliation.sh
          python3 -m py_compile scripts/external-capacity-sampler.py scripts/external-capacity-evaluate.py
      - name: Parse all k6 modules with exact runtime
        env:
          K6_IMAGE: ${{ steps.k6-image.outputs.ref }}
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm "$K6_IMAGE" version
          for script in k6-smoke.js k6-journey.js k6-load.js k6-spike.js k6-soak.js k6-websocket.js k6-webhook-burst.js; do
            docker run --rm \
              -v "$PWD/load:/scripts:ro" \
              -e API_BASE_URL=https://load-contract.invalid \
              -e RENOVA_LOAD_TOKEN_POOL='[{"token":"ci-contract-token","project_id":"project","chat_thread_id":"thread"}]' \
              -e RENOVA_YOOKASSA_WEBHOOK_SECRET=ci-contract-secret \
              -e LOAD_ENABLE_WRITES=true \
              "$K6_IMAGE" inspect "/scripts/$script" >/dev/null
          done

  external-staging-load:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: staging
    env:
      API_BASE: ${{ vars.STAGING_API_BASE_URL }}
      API_BASE_URL: ${{ vars.STAGING_API_BASE_URL }}
      TOKEN: ${{ secrets.STAGING_ADMIN_BEARER_TOKEN }}
      RENOVA_LOAD_TOKEN_POOL: ${{ secrets.STAGING_LOAD_TOKEN_POOL }}
      RENOVA_YOOKASSA_WEBHOOK_SECRET: ${{ secrets.STAGING_YOOKASSA_WEBHOOK_SECRET }}
      EXPECTED_RELEASE_SHA: ${{ inputs.release_sha }}
      EXPECTED_IMAGE_DIGEST: ${{ inputs.image_digest }}
      EXPECTED_ENVIRONMENT: staging
      LOAD_ENABLE_WRITES: ${{ inputs.enable_writes }}
      LOAD_RUN_ID: gh-${{ github.run_id }}-${{ github.run_attempt }}
      OUT_DIR: ${{ runner.temp }}/renova-load-slo
      CAPACITY_SAMPLE_STOP_FILE: ${{ runner.temp }}/renova-load-slo/capacity-sampler.stop
      CAPACITY_SAMPLE_INTERVAL_SEC: "5"
      CAPACITY_MIN_API_INSTANCES: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.2"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.13"
      - name: Read immutable k6 image
        id: k6-image
        shell: bash
        run: |
          set -euo pipefail
          ref="$(tr -d '\r\n' < load/K6_IMAGE)"
          [[ "$ref" =~ ^grafana/k6:2\.1\.0@sha256:[0-9a-f]{64}$ ]]
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      - name: Validate source contract before remote execution
        run: node --test scripts/loadSloIntegrity.test.mjs
        env:
          K6_IMAGE: ${{ steps.k6-image.outputs.ref }}
      - name: Verify exact immutable staging release before load
        shell: bash
        run: bash scripts/external-staging-release-smoke.sh
      - name: Start capacity sampler
        id: sampler
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OUT_DIR"
          rm -f "$CAPACITY_SAMPLE_STOP_FILE"
          nohup python3 scripts/external-capacity-sampler.py \
            >"$OUT_DIR/capacity-sampler.log" 2>&1 &
          pid=$!
          echo "$pid" >"$OUT_DIR/capacity-sampler.pid"
          sleep 2
          kill -0 "$pid"
      - name: Run selected production-auth k6 scenario
        id: k6
        continue-on-error: true
        env:
          K6_IMAGE: ${{ steps.k6-image.outputs.ref }}
          SCENARIO: ${{ inputs.scenario }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OUT_DIR"
          case "$SCENARIO" in
            smoke) script=k6-smoke.js ;;
            load) script=k6-load.js ;;
            spike) script=k6-spike.js ;;
            soak) script=k6-soak.js ;;
            websocket)
              [[ "$LOAD_ENABLE_WRITES" == "true" ]] || {
                echo "websocket scenario requires enable_writes=true" >&2
                exit 2
              }
              script=k6-websocket.js
              ;;
            webhook-burst) script=k6-webhook-burst.js ;;
            *) echo "unsupported scenario: $SCENARIO" >&2; exit 2 ;;
          esac
          docker run --rm \
            -v "$PWD/load:/scripts:ro" \
            -v "$OUT_DIR:/out" \
            -e API_BASE_URL \
            -e RENOVA_LOAD_TOKEN_POOL \
            -e RENOVA_YOOKASSA_WEBHOOK_SECRET \
            -e LOAD_ENABLE_WRITES \
            -e LOAD_RUN_ID \
            "$K6_IMAGE" run \
            --summary-export /out/k6-summary.json \
            "/scripts/$script"
      - name: Stop capacity sampler
        if: always() && steps.sampler.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          touch "$CAPACITY_SAMPLE_STOP_FILE"
          pid="$(cat "$OUT_DIR/capacity-sampler.pid")"
          for _ in $(seq 1 20); do
            if ! kill -0 "$pid" 2>/dev/null; then
              exit 0
            fi
            sleep 1
          done
          kill "$pid" 2>/dev/null || true
          echo "capacity sampler did not stop within 20 seconds" >&2
          exit 1
      - name: Evaluate runtime capacity evidence
        id: capacity
        if: always() && steps.sampler.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: python3 scripts/external-capacity-evaluate.py
      - name: Reconcile queues after load
        id: reconciliation
        if: always() && steps.k6.outcome != 'skipped'
        continue-on-error: true
        shell: bash
        run: bash scripts/external-load-reconciliation.sh
      - name: Record sanitized load evidence
        if: always() && steps.k6.outcome != 'skipped'
        env:
          SCENARIO: ${{ inputs.scenario }}
          K6_IMAGE: ${{ steps.k6-image.outputs.ref }}
          K6_OUTCOME: ${{ steps.k6.outcome }}
          CAPACITY_OUTCOME: ${{ steps.capacity.outcome }}
          RECONCILIATION_OUTCOME: ${{ steps.reconciliation.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OUT_DIR"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          out = Path(os.environ["OUT_DIR"])
          payload = {
              "release_sha": os.environ["EXPECTED_RELEASE_SHA"],
              "image_digest": os.environ["EXPECTED_IMAGE_DIGEST"],
              "scenario": os.environ["SCENARIO"],
              "bounded_writes_enabled": os.environ.get("LOAD_ENABLE_WRITES") == "true",
              "k6_image": os.environ["K6_IMAGE"],
              "k6_outcome": os.environ["K6_OUTCOME"],
              "capacity_outcome": os.environ.get("CAPACITY_OUTCOME"),
              "reconciliation_outcome": os.environ.get("RECONCILIATION_OUTCOME"),
              "capacity_proof_scope": "external_staging_exact_artifact",
              "minimum_api_instances_required": int(os.environ["CAPACITY_MIN_API_INSTANCES"]),
          }
          (out / "load-evidence.json").write_text(json.dumps(payload, indent=2) + "\n", encoding="utf-8")
          PY
      - name: Upload staging load evidence
        if: always() && steps.k6.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: load-slo-${{ inputs.scenario }}-${{ inputs.release_sha }}
          retention-days: 90
          if-no-files-found: error
          path: ${{ runner.temp }}/renova-load-slo/
      - name: Enforce staging load and capacity gates
        if: always() && steps.k6.outcome != 'skipped'
        env:
          K6_OUTCOME: ${{ steps.k6.outcome }}
          CAPACITY_OUTCOME: ${{ steps.capacity.outcome }}
          RECONCILIATION_OUTCOME: ${{ steps.reconciliation.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$K6_OUTCOME" == "success" ]]
          [[ "$CAPACITY_OUTCOME" == "success" ]]
          [[ "$RECONCILIATION_OUTCOME" == "success" ]]
