name: Security operations integrity

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-operations-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.12.13"
  POETRY_VERSION: "2.4.1"

jobs:
  source-contract:
    name: security-source-contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.2"
      - name: Validate security operations source contract
        run: node --test scripts/securityOperationsIntegrity.test.mjs

  python-advisories:
    name: python-runtime-advisories
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          check-latest: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.2"
      - name: Install pinned audit tooling
        shell: bash
        run: |
          set -euo pipefail
          audit_version="$(tr -d '\r\n' < security/PIP_AUDIT_VERSION)"
          [[ "$audit_version" == "2.10.1" ]]
          python -m pip install --disable-pip-version-check \
            "poetry==${POETRY_VERSION}" \
            "pip-audit==${audit_version}"
      - name: Materialize exact production dependency environment
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          poetry check --lock
          poetry sync --only main --no-root --no-interaction --no-ansi
          poetry run python -m pip check
      - name: Audit installed production environment
        id: pip-audit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/renova-security"
          site_packages="$(cd backend && poetry run python - <<'PY'
          import site
          paths = site.getsitepackages()
          if len(paths) != 1:
              raise SystemExit(f"expected one site-packages path, got {paths!r}")
          print(paths[0])
          PY
          )"
          set +e
          pip-audit \
            --path "$site_packages" \
            --strict \
            --progress-spinner off \
            --format json \
            --output "$RUNNER_TEMP/renova-security/pip-audit.json"
          rc=$?
          set -e
          printf '%s\n' "$rc" > "$RUNNER_TEMP/renova-security/pip-audit.exit"
          if [ "$rc" -gt 1 ]; then
            echo "pip-audit collection failed with exit code $rc" >&2
          fi
      - name: Enforce bounded advisory baseline
        shell: bash
        run: |
          set -euo pipefail
          node scripts/evaluatePythonAudit.mjs \
            "$RUNNER_TEMP/renova-security/pip-audit.json" \
            security/python-audit-baseline.json \
            "$RUNNER_TEMP/renova-security/pip-audit.exit" \
            "$RUNNER_TEMP/renova-security/python-audit-summary.json"
      - name: Upload sanitized Python advisory evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-advisory-evidence-${{ github.sha }}
          retention-days: 30
          if-no-files-found: warn
          path: ${{ runner.temp }}/renova-security/python-audit-summary.json

  secrets:
    name: full-history-secret-scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.2"
      - name: Read immutable Gitleaks image
        id: gitleaks
        shell: bash
        run: |
          set -euo pipefail
          image="$(tr -d '\r\n' < security/GITLEAKS_IMAGE)"
          [[ "$image" =~ ^ghcr\.io/gitleaks/gitleaks:v8\.30\.1@sha256:[0-9a-f]{64}$ ]]
          echo "image=$image" >> "$GITHUB_OUTPUT"
      - name: Scan full Git history with redaction
        env:
          GITLEAKS_IMAGE: ${{ steps.gitleaks.outputs.image }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/renova-security"
          set +e
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "$PWD:/repo:ro" \
            -v "$RUNNER_TEMP/renova-security:/out" \
            "$GITLEAKS_IMAGE" \
            git --no-banner --redact=100 \
            --report-format json \
            --report-path /out/gitleaks-raw.json \
            /repo
          rc=$?
          set -e
          printf '%s\n' "$rc" > "$RUNNER_TEMP/renova-security/gitleaks.exit"
          if [ ! -f "$RUNNER_TEMP/renova-security/gitleaks-raw.json" ]; then
            printf '[]\n' > "$RUNNER_TEMP/renova-security/gitleaks-raw.json"
          fi
      - name: Sanitize and enforce secret-scan result
        shell: bash
        run: |
          set -euo pipefail
          node scripts/sanitizeGitleaksReport.mjs \
            "$RUNNER_TEMP/renova-security/gitleaks-raw.json" \
            "$RUNNER_TEMP/renova-security/gitleaks-summary.json" \
            "$RUNNER_TEMP/renova-security/gitleaks.exit"
      - name: Delete raw secret-scan report
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/renova-security/gitleaks-raw.json"
      - name: Upload sanitized secret-scan evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: secret-scan-evidence-${{ github.sha }}
          retention-days: 30
          if-no-files-found: warn
          path: ${{ runner.temp }}/renova-security/gitleaks-summary.json
