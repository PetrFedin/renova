name: Temporary Poetry lock refresh

on:
  pull_request:

permissions:
  contents: read

jobs:
  refresh-lock:
    if: github.event.pull_request.number == 258
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12.13"
          check-latest: false
      - name: Install exact Poetry version
        run: python -m pip install --disable-pip-version-check "poetry==2.4.1"
      - name: Regenerate and validate backend lock
        working-directory: backend
        run: |
          set -euo pipefail
          poetry lock
          poetry check --lock
      - name: Upload generated lock only
        uses: actions/upload-artifact@v4
        with:
          name: backend-poetry-lock-${{ github.sha }}
          path: backend/poetry.lock
          if-no-files-found: error
          retention-days: 1
