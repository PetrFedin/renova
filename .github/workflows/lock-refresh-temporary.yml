name: Temporary Poetry lock refresh

on:
  pull_request:

permissions:
  contents: write

jobs:
  refresh-lock:
    if: >-
      github.event.pull_request.number == 258 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor == 'PetrFedin'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12.13"
          check-latest: false
      - name: Install exact Poetry version
        run: python -m pip install --disable-pip-version-check "poetry==2.4.1"
      - name: Regenerate and validate backend lock
        working-directory: backend
        run: |
          set -euo pipefail
          poetry lock
          poetry check --lock
      - name: Commit generated lock to this same-repository PR only
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          if git diff --quiet -- backend/poetry.lock; then
            echo "Poetry lock already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/poetry.lock
          git commit -m "build: regenerate Poetry lock after JWT hardening"
          git push origin "HEAD:${HEAD_REF}"
