name: Room change recovery integrity

on:
  pull_request:
    paths:
      - 'backend/app/api/v1/room_change_creation_integrity.py'
      - 'backend/app/api/v1/room_requests.py'
      - 'backend/app/api/v1/router.py'
      - 'backend/app/services/room_change_service.py'
      - 'backend/tests/test_room_change_recovery_integrity.py'
      - 'apps/mobile/lib/api/rooms.ts'
      - 'apps/mobile/lib/api/roomChangeRecovery.test.ts'
      - 'apps/mobile/lib/api/failurePolicy.ts'
      - '.github/workflows/room-change-recovery-integrity.yml'
  push:
    branches: [main]
    paths:
      - 'backend/app/api/v1/room_change_creation_integrity.py'
      - 'backend/app/api/v1/router.py'
      - 'backend/app/services/room_change_service.py'
      - 'backend/tests/test_room_change_recovery_integrity.py'
      - 'apps/mobile/lib/api/rooms.ts'
      - 'apps/mobile/lib/api/roomChangeRecovery.test.ts'
      - '.github/workflows/room-change-recovery-integrity.yml'

concurrency:
  group: room-change-recovery-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  room-change-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt
      - name: Install workspace dependencies
        run: npm ci
      - name: Backend request and decision lifecycle integrity
        working-directory: backend
        run: pytest -q tests/test_room_change_recovery_integrity.py
      - name: Mobile typecheck
        run: npm run typecheck:mobile
      - name: Mobile response-loss and decision replay contract
        run: |
          export TSX_TSCONFIG_PATH="$PWD/apps/mobile/tsconfig.json"
          npx tsx apps/mobile/lib/api/roomChangeRecovery.test.ts
