name: Agent JSX compatibility diagnostic

on:
  push:
    branches:
      - agent/jsx-compat-diagnostic
    paths:
      - .github/workflows/agent-jsx-compat-diagnostic.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Dependency type universe
        shell: bash
        run: |
          npm ls react react-dom react-native @types/react typescript --all || true
      - name: Compare TypeScript 6 and 5.9 diagnostics
        shell: bash
        run: |
          set -euo pipefail
          cd apps/mobile

          set +e
          npx tsc --noEmit -p . --pretty false > /tmp/mobile-ts6.log 2>&1
          ts6_code=$?
          npx --yes -p typescript@5.9.3 tsc --noEmit -p . --pretty false > /tmp/mobile-ts59.log 2>&1
          ts59_code=$?
          set -e

          report() {
            label="$1"
            file="$2"
            code="$3"
            echo "=== ${label} ==="
            echo "TSC_EXIT=${code}"
            echo "TS2786_COUNT=$(grep -c 'error TS2786:' "$file" || true)"
            echo "TS2607_COUNT=$(grep -c 'error TS2607:' "$file" || true)"
            echo "ALL_TS_DIAGNOSTICS=$(grep -Ec 'error TS[0-9]+:' "$file" || true)"
            echo '--- first 50 raw lines ---'
            head -n 50 "$file" || true
            echo '--- first 40 JSX compatibility diagnostics ---'
            grep -E 'error TS(2786|2607):' "$file" | head -n 40 || true
            echo '--- first 40 non-JSX diagnostics ---'
            grep -E 'error TS[0-9]+:' "$file" | grep -Ev 'error TS(2786|2607):' | head -n 40 || true
          }

          report 'TypeScript 6.0.3 workspace' /tmp/mobile-ts6.log "$ts6_code"
          report 'TypeScript 5.9.3 probe' /tmp/mobile-ts59.log "$ts59_code"
