name: Agent H0 release truth codemod

on:
  push:
    branches:
      - agent/release-gates-fail-closed
    paths:
      - .github/workflows/agent-h0-release-truth-codemod.yml

permissions:
  contents: write

jobs:
  harden-h0:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/release-gates-fail-closed
          fetch-depth: 0

      - name: Apply exact H0 fail-closed changes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/h0-check.sh')
          text = path.read_text()

          def replace_exact(old: str, new: str, expected: int = 1) -> None:
              global text
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f'expected {expected} occurrence(s), found {count}: {old[:120]!r}')
              text = text.replace(old, new)

          replace_exact(
              '''for arg in "$@"; do
  case "$arg" in
    --strict) STRICT=1 ;;
    --live) LIVE=1 ;;
  esac
done
''',
              '''for arg in "$@"; do
  case "$arg" in
    --strict) STRICT=1 ;;
    --live) LIVE=1 ;;
    *) echo "FAIL unsupported argument: $arg" >&2; exit 2 ;;
  esac
done
# Strict is a release/investor gate, so it must include live verification.
if [[ "$STRICT" -eq 1 ]]; then LIVE=1; fi
LIVE_TOKEN="${TOKEN:-${H0_TOKEN:-}}"
''',
          )

          replace_exact(
              '''if bash scripts/staging-env-smoke.sh; then
  pass "staging-env-smoke"
else
  fail "staging-env-smoke"
fi
''',
              '''if [[ "$LIVE" -eq 1 || -n "${API_BASE:-}" ]]; then
  if [[ -z "${API_BASE:-}" ]]; then
    fail "live H0 requires API_BASE=https://..."
  elif [[ -z "$LIVE_TOKEN" ]]; then
    fail "live H0 requires TOKEN or H0_TOKEN Bearer JWT"
  elif API_BASE="$API_BASE" TOKEN="$LIVE_TOKEN" REQUIRE_REMOTE=1 bash scripts/staging-env-smoke.sh; then
    pass "staging-env-smoke remote Bearer"
  else
    fail "staging-env-smoke remote Bearer"
  fi
else
  if REQUIRE_REMOTE=0 bash scripts/staging-env-smoke.sh; then
    pass "staging-env-smoke config-only (remote not claimed)"
  else
    fail "staging-env-smoke config-only"
  fi
fi
''',
          )

          replace_exact(
              '''    # Prefer JWT Bearer (staging forbids X-User-Id). Fallback: H0_TOKEN / H0_USER_ID legacy.
    AUTH_HDR=()
    DEMO_JSON="$(curl -sf -X POST "$API_BASE/api/v1/auth/demo" -H "Content-Type: application/json" -d "{\\"role\\":\\"contractor\\"}" || true)"
    if [[ -n "$DEMO_JSON" ]]; then
      DEMO_TOKEN="$(python3 -c "import json,sys; d=json.load(sys.stdin); print((d.get('access_token') or '').strip())" <<< "$DEMO_JSON")"
      DEMO_ID="$(python3 -c "import json,sys; print(json.load(sys.stdin).get('id',''))" <<< "$DEMO_JSON")"
      if [[ -n "$DEMO_TOKEN" ]]; then
        AUTH_HDR=(-H "Authorization: Bearer $DEMO_TOKEN")
      elif [[ -n "$DEMO_ID" ]]; then
        warn "demo returned id without access_token — falling back to X-User-Id (dev only)"
        AUTH_HDR=(-H "X-User-Id: $DEMO_ID")
      fi
    elif [[ -n "${H0_TOKEN:-}" ]]; then
      AUTH_HDR=(-H "Authorization: Bearer $H0_TOKEN")
    elif [[ -n "${H0_USER_ID:-}" ]]; then
      warn "using H0_USER_ID without token — staging will reject if header auth forbidden"
      AUTH_HDR=(-H "X-User-Id: $H0_USER_ID")
    else
      warn "demo auth disabled — set H0_TOKEN=... (Bearer) to query /admin/h0-readiness"
    fi
''',
              '''    # Live release checks accept only an explicit Bearer token.
    # Demo auth and X-User-Id are forbidden here even if a development server exposes them.
    AUTH_HDR=()
    if [[ -n "$LIVE_TOKEN" ]]; then
      AUTH_HDR=(-H "Authorization: Bearer $LIVE_TOKEN")
    else
      fail "set TOKEN or H0_TOKEN Bearer JWT to query /admin/h0-readiness"
    fi
''',
          )

          replace_exact(
              '''    else
      warn "set H0_TOKEN=... (Bearer JWT) to query /admin/h0-readiness"
    fi
''',
              '''    else
      fail "live H0 readiness was not queried because Bearer auth is missing"
    fi
''',
          )

          path.write_text(text)
          PY

      - name: Validate shell and fail-closed source contract
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/h0-check.sh
          grep -q 'if \[\[ "$STRICT" -eq 1 \]\]; then LIVE=1; fi' scripts/h0-check.sh
          grep -q 'REQUIRE_REMOTE=1 bash scripts/staging-env-smoke.sh' scripts/h0-check.sh
          grep -q 'TOKEN or H0_TOKEN Bearer JWT' scripts/h0-check.sh
          if grep -q '/api/v1/auth/demo' scripts/h0-check.sh; then
            echo 'FAIL: H0 live gate still calls demo auth' >&2
            exit 1
          fi
          if grep -q 'H0_USER_ID' scripts/h0-check.sh; then
            echo 'FAIL: H0 live gate still accepts header identity fallback' >&2
            exit 1
          fi

      - name: Commit validated H0 change and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'renova-agent'
          git config user.email '81327591+PetrFedin@users.noreply.github.com'
          git rm .github/workflows/agent-h0-release-truth-codemod.yml
          git add scripts/h0-check.sh
          git commit -m 'fix(release): require live Bearer H0 verification'
          git push origin HEAD:agent/release-gates-fail-closed
