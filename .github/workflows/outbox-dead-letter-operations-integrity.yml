name: Outbox dead-letter operations integrity

on:
  pull_request:
    paths:
      - "backend/app/api/admin_access.py"
      - "backend/app/api/v1/admin.py"
      - "backend/app/api/v1/admin_outbox_dead_letters.py"
      - "backend/app/middleware/audit.py"
      - "backend/app/models/entities.py"
      - "backend/app/models/outbox_runtime.py"
      - "backend/app/services/outbox_dead_letter_service.py"
      - "backend/app/services/outbox_service.py"
      - "backend/tests/test_admin_rbac_integrity.py"
      - "backend/tests/test_outbox_dead_letter_operations_integrity.py"
      - ".github/workflows/outbox-dead-letter-operations-integrity.yml"
      - ".github/actions/setup-backend/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: outbox-dead-letter-operations-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dead-letter-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ENVIRONMENT: test
      DATABASE_URL: sqlite+aiosqlite:///./outbox-dead-letter-tests.db
      PUBLIC_BASE_URL: http://127.0.0.1:8100
      SECRET_KEY: ci-secret-key-at-least-16
      ALLOW_CREATE_ALL: "true"
      ALLOW_DEMO_SEED: "true"
      AUTOMATION_REMINDERS_ENABLED: "0"
      PYTHONHASHSEED: "0"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Set up locked backend environment
        uses: ./.github/actions/setup-backend
      - name: Verify dead-letter recovery contracts
        working-directory: backend
        run: |
          set -o pipefail
          timeout 420s poetry run pytest -vv -s --tb=short \
            tests/test_outbox_dead_letter_operations_integrity.py \
            tests/test_admin_rbac_integrity.py \
            2>&1 | tee outbox-dead-letter-operations-integrity.log
      - name: Upload dead-letter diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: outbox-dead-letter-operations-integrity-diagnostics
          path: backend/outbox-dead-letter-operations-integrity.log
          if-no-files-found: warn
          retention-days: 14
