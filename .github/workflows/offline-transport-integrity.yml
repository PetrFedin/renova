name: Offline transport and cache integrity

on:
  pull_request:
    paths:
      - 'apps/mobile/lib/api/client.ts'
      - 'apps/mobile/lib/api/failurePolicy.ts'
      - 'apps/mobile/lib/api/failurePolicy.test.ts'
      - 'apps/mobile/lib/api/cacheProvenance.test.ts'
      - 'apps/mobile/lib/api/replaySafeProducer.test.ts'
      - 'apps/mobile/lib/api/receipts.ts'
      - 'apps/mobile/lib/api/chats.ts'
      - 'apps/mobile/lib/api/chatCommands.ts'
      - 'apps/mobile/lib/offlineQueue.ts'
      - 'apps/mobile/components/renova/StaleCacheBanner.tsx'
      - '.github/workflows/offline-transport-integrity.yml'
  push:
    branches: [main]
    paths:
      - 'apps/mobile/lib/api/client.ts'
      - 'apps/mobile/lib/api/failurePolicy.ts'
      - 'apps/mobile/lib/api/receipts.ts'
      - 'apps/mobile/lib/api/chats.ts'
      - 'apps/mobile/lib/offlineQueue.ts'
      - 'apps/mobile/components/renova/StaleCacheBanner.tsx'
      - '.github/workflows/offline-transport-integrity.yml'

concurrency:
  group: offline-transport-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-transport:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install workspace dependencies
        run: npm ci
      - name: Fail-closed mobile TypeScript integrity
        run: npm run typecheck:mobile
      - name: Prove ambiguous transport classification
        run: |
          export TSX_TSCONFIG_PATH="$PWD/apps/mobile/tsconfig.json"
          npx tsx apps/mobile/lib/api/failurePolicy.test.ts
      - name: Prove replay-safe producers preserve first command identity
        run: |
          export TSX_TSCONFIG_PATH="$PWD/apps/mobile/tsconfig.json"
          npx tsx apps/mobile/lib/api/replaySafeProducer.test.ts
      - name: Prove cache provenance and freshness truth
        run: |
          export TSX_TSCONFIG_PATH="$PWD/apps/mobile/tsconfig.json"
          npx tsx apps/mobile/lib/api/cacheProvenance.test.ts
