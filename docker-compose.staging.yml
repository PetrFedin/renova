# Isolated dependencies for the local/CI staging runtime smoke.
# Usage: bash scripts/staging-postgres-smoke.sh
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: renova
      POSTGRES_PASSWORD: renova
      POSTGRES_DB: renova_staging
    ports:
      - "5435:5432"
    volumes:
      - renova_pg_staging:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U renova -d renova_staging"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6381:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  renova_pg_staging:
